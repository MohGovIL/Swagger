components:
  securitySchemes:
    mtlsTransport:
      type: mutualTLS
      description: |
        mTLS is required on PCM API connections, including discovery, token, and introspection. Browser requests to /authorize and associated interactive login/approval pages use HTTPS without requiring a client certificate. The presented client certificate is not the OAuth2 client authentication method; OAuth2 clients additionally authenticate with private_key_jwt where the endpoint requires it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: OAuth2 bearer token accepted for introspection caller authentication.
  schemas:
    SmartAuthorizationRequest:
      type: object
      description: Standalone SMART authorization parameters, sent in the GET query string or the POST
        form body.
      required:
      - response_type
      - client_id
      - redirect_uri
      - scope
      - state
      - code_challenge
      - code_challenge_method
      - aud
      properties:
        response_type:
          type: string
          const: code
        client_id:
          type: string
          description: Opaque PCM-assigned OAuth client identifier for the Service Provider application.
        redirect_uri:
          type: string
          format: uri
          description: Exact registered standalone SMART redirect URI.
        scope:
          type: string
          minLength: 1
          pattern: '^(?!user/)(?!.* user/)(?!.*(?:\?|&)_filter(?:=|&|$))\S+(?: \S+)*$'
          example: patient/*.rs
          description: |
            Space-delimited SMART App Launch v2 patient-level resource-scope
            string. PCM accepts standard patient-level scope syntax, including
            query constraints, search modifiers, chaining, and reverse chaining.
            user/... scopes and _filter are unsupported. URL-encode the complete
            value once so ampersands inside constraints remain part of scope
            rather than becoming separate GET query parameters or POST form fields.
            Requested scopes remain subject to client, user, service-definition,
            and PCM authorization policy.
        state:
          type: string
          minLength: 1
          description: Unpredictable client-generated value validated after redirect.
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
        code_challenge_method:
          type: string
          const: S256
        aud:
          type: string
          format: uri
          enum:
          - https://pcm2mtest.health.gov.il/api/fhir-service/r4
          - https://pcm2m.health.gov.il/api/fhir-service/r4
          description: Exact PCM FHIR REST API base for the environment being called. A request to the
            test authorization endpoint must carry the test base; a request to production must carry
            the production base. Never mix the two within one flow.
    OAuthAuthorizationServerMetadata:
      type: object
      description: |
        OAuth authorization-server metadata for the current environment.
        Clients must tolerate additional metadata properties and additional
        advertised algorithm values. `registration_endpoint` is omitted until
        PCM enables a supported dynamic-registration interaction.
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - introspection_endpoint
      - grant_types_supported
      - response_types_supported
      - code_challenge_methods_supported
      - token_endpoint_auth_methods_supported
      - token_endpoint_auth_signing_alg_values_supported
      - introspection_endpoint_auth_methods_supported
      - introspection_endpoint_auth_signing_alg_values_supported
      - tls_client_certificate_bound_access_tokens
      - authorization_details_types_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        introspection_endpoint:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
          description: Optional OAuth 2.0 dynamic client-registration endpoint. Omitted until the capability is
            enabled.
        grant_types_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
          description: Response modes advertised for the authorization-code flow.
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          minItems: 2
          uniqueItems: true
          contains:
            type: string
            const: ES256
          allOf:
          - contains:
              const: ES384
          items:
            type: string
          description: PCM currently advertises ES256 and ES384. Clients must tolerate additional advertised
            algorithms during compatible migration.
        introspection_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        introspection_endpoint_auth_signing_alg_values_supported:
          type: array
          minItems: 2
          uniqueItems: true
          contains:
            type: string
            const: ES256
          allOf:
          - contains:
              const: ES384
          items:
            type: string
          description: PCM currently advertises ES256 and ES384. Clients must tolerate additional advertised
            algorithms during compatible migration.
        tls_client_certificate_bound_access_tokens:
          type: boolean
          const: false
          description: PCM issues Bearer access tokens and does not advertise RFC 8705 certificate-bound access
            tokens.
        authorization_details_types_supported:
          type: array
          minItems: 1
          items:
            type: string
            const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
          maxItems: 1
    TokenRequest:
      oneOf:
      - $ref: '#/components/schemas/AuthorizationCodeTokenRequest'
      - $ref: '#/components/schemas/PCMManagementTokenRequest'
      - $ref: '#/components/schemas/IntrospectionBearerTokenRequest'
      - $ref: '#/components/schemas/DataSourceAccessTokenRequest'
    AuthorizationCodeTokenRequest:
      type: object
      additionalProperties: false
      required:
      - grant_type
      - code
      - redirect_uri
      - code_verifier
      - client_assertion_type
      - client_assertion
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
          minLength: 1
          description: Short-lived, single-use code returned by the authorization endpoint.
        redirect_uri:
          type: string
          format: uri
          description: Exact URI used in the authorization request and registered for this client.
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        client_assertion_type:
          $ref: '#/components/schemas/ClientAssertionType'
        client_assertion:
          $ref: '#/components/schemas/ClientAssertion'
    PCMManagementTokenRequest:
      type: object
      additionalProperties: false
      required:
      - grant_type
      - client_assertion_type
      - client_assertion
      - scope
      - resource
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_assertion_type:
          $ref: '#/components/schemas/ClientAssertionType'
        client_assertion:
          $ref: '#/components/schemas/ClientAssertion'
        scope:
          type: string
          const: system/*.crus
          description: Coarse PCM-management authorization ceiling; role, ownership, Organization state,
            field, and operation rules still apply. A participant Endpoint being suspended or off does
            not by itself prevent its owner from obtaining management access to resume or replace it.
        resource:
          type: string
          format: uri
          description: Exact PCM FHIR REST API base, not an individual resource URL. Must be the value
            for the environment being called. The published specification pins this to the production
            literal; both environment values are accepted here.
          enum:
          - https://pcm2mtest.health.gov.il/api/fhir-service/r4
          - https://pcm2m.health.gov.il/api/fhir-service/r4
    IntrospectionBearerTokenRequest:
      type: object
      additionalProperties: false
      required:
      - grant_type
      - client_assertion_type
      - client_assertion
      - scope
      - resource
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_assertion_type:
          $ref: '#/components/schemas/ClientAssertionType'
        client_assertion:
          $ref: '#/components/schemas/ClientAssertion'
        scope:
          type: string
          const: system/*.crus
          description: Common PCM authorization ceiling; the exact resource and active Data Source role
            remain mandatory.
        resource:
          type: string
          format: uri
          enum:
          - https://pcm2mtest.health.gov.il/api/fhir-service/r4/introspect
          - https://pcm2m.health.gov.il/api/fhir-service/r4/introspect
          description: Must be the value for the environment being called. The published specification
            pins this to the production literal; both environment values are accepted here.
    DataSourceAccessTokenRequest:
      type: object
      additionalProperties: false
      required:
      - grant_type
      - client_assertion_type
      - client_assertion
      - resource
      - scope
      - authorization_details
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_assertion_type:
          $ref: '#/components/schemas/ClientAssertionType'
        client_assertion:
          $ref: '#/components/schemas/ClientAssertion'
        resource:
          type: string
          format: uri
          pattern: ^https://[^\s#]+$
          description: Exactly one current active Data Source Endpoint.address. No fragment, alias, redirect equivalence
            or multiple audiences. PCM validates explicit source membership and current eligibility for the resolved Contract.
        scope:
          type: string
          pattern: '^(?:patient|system)/[A-Z][A-Za-z]+\.(?:r|s|rs)(?: (?:patient|system)/[A-Z][A-Za-z]+\.(?:r|s|rs))*$'
          description: Unfiltered resource/interaction ceiling. Consent uses patient/ scopes; authentication requests
            patient/Patient.s; presence requests system/Patient.s; discovery requests system/Patient.s system/RelatedPerson.s.
            PCM compiles all predicates. Unsupported resource names, duplicates, mixed context families and permissions
            outside the service are invalid_scope.
        authorization_details:
          $ref: '#/components/schemas/AuthorizationDetailsFormValue'
    ClientAssertionType:
      type: string
      const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    ClientAssertion:
      type: string
      contentMediaType: application/jwt
      contentSchema:
        $ref: '#/components/schemas/ClientAssertionClaims'
      x-decoded-header-schema:
        $ref: '#/components/schemas/ClientAssertionHeader'
      x-decoded-payload-schema:
        $ref: '#/components/schemas/ClientAssertionClaims'
      description: |-
        Fresh compact private_key_jwt assertion signed with ES256 or ES384 and the key registered out of band
        for the opaque client ID. The JOSE header requires alg and typ=JWT; kid is optional for either algorithm.
        SMART clients must include kid. When supplied, kid is currently the
        unpadded base64url-encoded SHA-256 JWK thumbprint of the assertion-signing public key under RFC 7638,
        including for ES384. When supplied, kid selects the uniquely matching approved signing key within the
        client's registration; an unknown, malformed, or mismatched value fails as invalid_client without fallback.
        When absent, PCM resolves the key by client ID. In both
        cases, PCM requires an unambiguously selected approved key for that client, algorithm compatibility, and
        a valid signature; failure is invalid_client. The current profile prohibits x5c, x5t#S256, and jku in the header.

        iss and sub equal the client ID; aud is the exact receiving PCM OAuth endpoint; iat is the issue time;
        exp is later than iat by at most 300 seconds; jti is unique. When one certificate is registered for
        the calling role/application, it is used for mTLS and assertion signing. When PCM registers different
        certificates, the payload SHOULD contain cnf.x5t#S256 for the certificate presented on the mTLS
        connection. PCM rejects a supplied mismatch. This certificate thumbprint is distinct from kid, which
        identifies the signing public key. Neither value makes the issued access token certificate-bound.

        Every request, including a retry, uses a new assertion. All token classes use this authentication-only
        claim set. Business authorization belongs exclusively in authorization_details; extensions.hl7-b2b is
        rejected.
    ClientAssertionHeader:
      type: object
      required:
      - alg
      - typ
      additionalProperties: false
      properties:
        alg:
          type: string
          enum:
          - ES256
          - ES384
        typ:
          type: string
          const: JWT
        kid:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Unpadded base64url-encoded SHA-256 JWK thumbprint of the registered assertion-signing public key
            under RFC 7638. Hash only the required public JWK members; for EC these are crv, kty, x, y in lexicographic
            order. This is not a certificate thumbprint. PCM must match it to an approved key for this client.
      description: Decoded JOSE header for token and direct-introspection client assertions. PCM accepts either algorithm
        with or without kid; SMART clients must include kid. Supplied kid values must match an approved key for the client;
        invalid values fail without fallback. Omission uses client-ID-based key resolution. Example public
        keys below are illustrative only and do not authorize any client. Compact assertion examples have placeholder
        signatures.
      x-example-public-jwks:
        keys:
        - crv: P-256
          kty: EC
          x: 1SjnrcDvV_aj1K4Gf-wu7cASInkqMgtlVT7SCHFhCsY
          y: KB45U0VZrtn2QCA5bhy3_IW7t1Mf1dJ-iRB_YGM10IE
          kid: CKo7NS1KIExQbeKkBOU1FVYOxgW-f_VB7uBxB29jZCs
        - crv: P-384
          kty: EC
          x: Dds11v1pXZR17ZSBkbPFE0MwdZ-L6VIf1ezc8BZzBIR8Qa-tjCs7A_5AXc6Csocv
          y: OmZI2dDLG-MqoFrJbAgLO1BumrTwNfz08VzZoyT9_t8BsPn8Tr0bZ5_3wa1evX2U
          kid: uTBLakUt5ynLNPtV5W29qaBWglltJeByc-KEyXQHUdU
      examples:
      - alg: ES256
        typ: JWT
        kid: CKo7NS1KIExQbeKkBOU1FVYOxgW-f_VB7uBxB29jZCs
      - alg: ES384
        typ: JWT
        kid: uTBLakUt5ynLNPtV5W29qaBWglltJeByc-KEyXQHUdU
      - alg: ES256
        typ: JWT
      - alg: ES384
        typ: JWT
    ClientAssertionClaims:
      type: object
      required:
      - iss
      - sub
      - aud
      - jti
      - iat
      - exp
      properties:
        iss:
          type: string
          minLength: 1
        sub:
          type: string
          minLength: 1
        aud:
          type: string
          format: uri
        jti:
          type: string
          minLength: 1
        iat:
          type: integer
        exp:
          type: integer
        cnf:
          $ref: '#/components/schemas/CertificateThumbprint'
      additionalProperties: false
      description: Authentication only. iss and sub SHALL equal the registered client_id; aud SHALL equal the receiving
        OAuth endpoint. exp-iat SHALL be positive and at most 300 seconds. A jti is accepted once. Authorization
        fields, extensions.hl7-b2b and unknown claims are prohibited.
    CertificateThumbprint:
      type: object
      additionalProperties: false
      required:
      - x5t#S256
      properties:
        x5t#S256:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Base64url-encoded SHA-256 thumbprint of the DER-encoded X.509 certificate, without
            padding.
    PCMOrganizationIdentifierUri:
      type: string
      format: uri
      pattern: ^http://pcm\.fhir\.health\.gov\.il/identifier/pcm-organization-id#[^#\s]+$
      description: |
        Registered stable identifier for the requesting Service Provider,
        serialized using the HL7 B2B preferred identifier URI form:
        `http://pcm.fhir.health.gov.il/identifier/pcm-organization-id#{value}`.
        It identifies the organizational requestor, not the target Data Source,
        and the value is the PCM Organization business identifier, not the FHIR
        logical id.
    PresenceScope:
      oneOf:
      - $ref: '#/components/schemas/OnlinePresenceScope'
      - $ref: '#/components/schemas/BatchPresenceScope'
    OnlinePresenceScope:
      type: string
      pattern: ^system/Patient\.s\?identifier=[^|,&\s]+\|[^|,&\s]+&_security=http://fhir\.health\.gov\.il/cs/il-hdp-information-buckets\|patientDemographics$
      description: Exact count-only Patient search scope containing one identifier in `system|value` form and the patientDemographics bucket.
    BatchPresenceScope:
      type: string
      pattern: ^system/Patient\.s\?identifier=[^|,&\s]+\|[^|,&\s]+,[^|,&\s]+\|[^|,&\s]+(?:,[^|,&\s]+\|[^|,&\s]+)*&_security=http://fhir\.health\.gov\.il/cs/il-hdp-information-buckets\|patientDemographics$
      description: Count-only Patient search scope containing at least two comma-separated identifiers
        in `system|value` form and the patientDemographics bucket.
    TokenResponse:
      oneOf:
      - $ref: '#/components/schemas/BasicTokenResponse'
      - $ref: '#/components/schemas/DataSourceTokenResponse'
    IntrospectionRequest:
      oneOf:
      - $ref: '#/components/schemas/BearerAuthenticatedIntrospectionRequest'
      - $ref: '#/components/schemas/DirectAssertionIntrospectionRequest'
    BearerAuthenticatedIntrospectionRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          description: Opaque subject token to introspect; distinct from the caller bearer credential.
        token_type_hint:
          type: string
          const: access_token
    DirectAssertionIntrospectionRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - client_assertion_type
      - client_assertion
      properties:
        token:
          type: string
          description: Opaque subject token to introspect.
        token_type_hint:
          type: string
          const: access_token
        client_assertion_type:
          $ref: '#/components/schemas/ClientAssertionType'
        client_assertion:
          allOf:
          - $ref: '#/components/schemas/ClientAssertion'
          description: Fresh assertion whose `aud` is the exact introspection endpoint of
            the environment being called - `https://pcm2mtest.health.gov.il/api/fhir-service/r4/introspect`
            for test, `https://pcm2m.health.gov.il/api/fhir-service/r4/introspect` for production.
    IntrospectionResponse:
      oneOf:
      - $ref: '#/components/schemas/ActiveIntrospectionResponse'
      - $ref: '#/components/schemas/InactiveIntrospectionResponse'
    ActiveIntrospectionResponse:
      type: object
      description: Audience-filtered active response with nested RAR context. For patient/ scopes the HO resolves
        the single authorization-patient identifier to exactly one local Patient and establishes the internal
        patient context, populating its internal patient element if used. The effective scope prefix determines
        this processing without Contract retrieval. System scopes do not establish a Patient compartment,
        including one-patient presence. Mixed patient/ and system/ scopes per token are unsupported.
        The HO SHOULD validate the Contract identifier against its configured workflow; runtime retrieval is not expected.
        PCM rechecks mutable dependencies and known deadlines; the source enforces scopes/context
        on every request, including batch entries and pages. No top-level patient, fhirContext or cnf.
      additionalProperties: false
      required:
      - active
      - scope
      - client_id
      - pcm_authentication_context
      - exp
      - iss
      - aud
      - sub
      - authorization_details
      - iat
      properties:
        active:
          type: boolean
          const: true
        scope:
          type: string
          description: Effective SMART grant fixed at issuance, also returned in RAR token responses. Dependency
            changes that would narrow or invalidate it result in active:false.
        client_id:
          type: string
          description: Opaque PCM-assigned OAuth client identifier for the authenticated role/application.
        pcm_authentication_context:
          $ref: '#/components/schemas/PCMAuthenticationContext'
        organization_id:
          $ref: '#/components/schemas/PCMOrganizationIdentifierUri'
          description: PCM-derived Service Provider child identifier for Consent access. Omitted for PCM-owned
            system workflow clients; their identity is conveyed by client_id and the Contract grantee.
        exp:
          type: integer
        iat:
          type: integer
        iss:
          type: string
          format: uri
          enum:
          - https://pcm2mtest.health.gov.il/api/fhir-service/r4
          - https://pcm2m.health.gov.il/api/fhir-service/r4
          description: Must be the value for the environment being called. The published specification pins this
            to the production literal; both environment values are accepted here.
        aud:
          type: string
          format: uri
          description: Audience/resource server for the token. For data-source access tokens this is the data source
            FHIR base URL supplied as the token request `resource`.
        sub:
          type: string
          description: OAuth subject for the token.
        authorization_details:
          $ref: '#/components/schemas/EffectiveAuthorizationDetails'
      allOf:
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ConsentAuthorizationDetails'
              maxItems: 1
        then:
          required:
          - organization_id
          properties:
            scope:
              type: string
              pattern: ^patient/
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PresenceAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            organization_id: false
            scope:
              $ref: '#/components/schemas/PresenceScope'
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/AuthenticationAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            organization_id: false
            scope:
              type: string
              const: patient/Patient.s?_security=http://fhir.health.gov.il/cs/il-hdp-information-buckets|patientDemographics
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DiscoveryAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            organization_id: false
            scope:
              type: string
              pattern: ^system/Patient\.s\?_has:RelatedPerson:patient:identifier=[^&\s]+&_security=http://fhir\.health\.gov\.il/cs/il-hdp-information-buckets\|patientDemographics system/RelatedPerson\.s\?identifier=[^&\s]+&_security=http://fhir\.health\.gov\.il/cs/il-hdp-information-buckets\|patientDemographics&_tag=http://fhir\.health\.gov\.il/cs/il-hdp-resource-tags\|hmo-dependent-discovery$
    PCMAuthenticationContext:
      type: object
      additionalProperties: false
      required:
      - token_endpoint_mtls
      - client_assertion_signing
      - correlation_verified
      description: |
        PCM-specific informational record of the two certificate roles observed
        during subject-token issuance. It is not a standard `cnf` claim and does
        not change Bearer-token semantics. A Data Source MAY apply local policy
        by comparing the protected-resource mTLS certificate to
        `token_endpoint_mtls`.
      properties:
        token_endpoint_mtls:
          allOf:
          - $ref: '#/components/schemas/CertificateThumbprint'
          description: Certificate presented on the token endpoint mTLS connection.
        client_assertion_signing:
          allOf:
          - $ref: '#/components/schemas/CertificateThumbprint'
          description: Certificate whose registered public key verified the private_key_jwt assertion.
        correlation_verified:
          type: boolean
          const: true
          description: PCM verified that both observed certificate roles belong to the authenticated client
            and that any supplied assertion `cnf` matched the mTLS connection.
    InactiveIntrospectionResponse:
      type: object
      description: |
        Privacy-safe inactive result, including after this Data Source's
        source-specific one-hour window for one-time Consent access has ended.
      additionalProperties: false
      required:
      - active
      properties:
        active:
          type: boolean
          const: false
    PatientFhirContext:
      type: object
      additionalProperties: false
      required:
      - type
      - role
      - identifier
      properties:
        type:
          type: string
          const: Patient
        role:
          type: string
          const: https://pcm.fhir.health.gov.il/fhir-context-role/authorization-patient
        identifier:
          $ref: '#/components/schemas/PatientIdentifier'
    ConsentFhirContext:
      type: object
      additionalProperties: false
      required:
      - type
      - role
      - identifier
      properties:
        type:
          type: string
          const: Consent
        role:
          type: string
          const: https://pcm.fhir.health.gov.il/fhir-context-role/authorization-basis
        identifier:
          $ref: '#/components/schemas/ConsentBusinessIdentifier'
    HealthcareServiceFhirContext:
      type: object
      additionalProperties: false
      required:
      - type
      - role
      - identifier
      properties:
        type:
          type: string
          const: HealthcareService
        role:
          type: string
          const: https://pcm.fhir.health.gov.il/fhir-context-role/healthcare-service
        identifier:
          $ref: '#/components/schemas/HealthcareServiceBusinessIdentifier'
    ConsentBusinessIdentifier:
      type: object
      additionalProperties: false
      required:
      - system
      - value
      properties:
        system:
          type: string
          format: uri
          const: http://pcm.fhir.health.gov.il/identifier/pcm-consent-id
        value:
          type: string
          minLength: 1
    HealthcareServiceBusinessIdentifier:
      type: object
      additionalProperties: false
      required:
      - system
      - value
      properties:
        system:
          type: string
          format: uri
          const: http://pcm.fhir.health.gov.il/identifier/pcm-healthcareservice-instance-id
        value:
          type: string
          minLength: 1
    PatientIdentifier:
      type: object
      additionalProperties: false
      required:
      - system
      - value
      properties:
        system:
          type: string
          format: uri
        value:
          type: string
          minLength: 1
          maxLength: 128
      description: An exact Israeli national-ID, Palestinian national-ID, passport or synthetic test identifier.
        Israeli IDs preserve nine digits and SHALL pass the
        PCM check-digit rule. Passport systems SHALL belong to the agreed IL Core passport-system ValueSet. Values
        are never matched without their system. HMO authentication and discovery interfaces support synthetic
        identifiers 1 and 2 for HTEST-labelled integration tests. Interface support does not establish PCM login
        eligibility. PCM patient login accepts Israeli and Palestinian national IDs and eligible foreign passports.
        It rejects synthetic identifiers and Israeli passports; Israeli nationals
        holding an Israeli ID must use that ID rather than a foreign passport.
      oneOf:
      - properties:
          system:
            type: string
            const: http://fhir.health.gov.il/identifier/il-national-id
          value:
            type: string
            pattern: ^[0-9]{9}$
      - properties:
          system:
            type: string
            const: http://fhir.health.gov.il/identifier/pna-national-id
      - properties:
          system:
            type: string
            pattern: ^http://hl7\.org/fhir/sid/passport-[A-Z]{3}$
      - properties:
          system:
            type: string
            const: http://fhir.health.gov.il/identifier/il-hdp-test-id
          value:
            type: string
            enum: ['1', '2']
    OAuthErrorBody:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
        error_description:
          type: string
    ContractBusinessIdentifier:
      type: object
      additionalProperties: false
      required:
      - system
      - value
      properties:
        system:
          type: string
          const: http://pcm.fhir.health.gov.il/identifier/pcm-data-access-authorization-id
        value:
          type: string
          minLength: 1
          maxLength: 128
    ContractFhirContext:
      type: object
      additionalProperties: false
      required:
      - type
      - role
      - identifier
      properties:
        type:
          type: string
          const: Contract
        role:
          type: string
          const: https://pcm.fhir.health.gov.il/fhir-context-role/authorization-basis
        identifier:
          $ref: '#/components/schemas/ContractBusinessIdentifier'
    DiscoveryRepresentativeFhirContext:
      type: object
      additionalProperties: false
      required:
      - type
      - role
      - identifier
      properties:
        type:
          type: string
          const: RelatedPerson
        role:
          type: string
          const: https://pcm.fhir.health.gov.il/fhir-context-role/discovery-representative
        identifier:
          $ref: '#/components/schemas/PatientIdentifier'
      description: Response-only attestation of the authenticated person for whom PCM discovers dependents. Does
        not establish guardianship over every candidate and SHALL NOT create a Patient compartment context. Multiple
        RelatedPerson records may carry the same identifier. PCM SHALL compile both scopes using this exact identity.
    ConsentAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 1
          items:
            oneOf:
            - $ref: '#/components/schemas/ConsentFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ConsentFhirContext'
            minContains: 1
            maxContains: 1
          maxItems: 1
    PatientPolicyAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 2
          items:
            oneOf:
            - $ref: '#/components/schemas/ContractFhirContext'
            - $ref: '#/components/schemas/PatientFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ContractFhirContext'
            minContains: 1
            maxContains: 1
          - contains:
              $ref: '#/components/schemas/PatientFhirContext'
            minContains: 1
      description: Presence permits one or more distinct Patient identifiers. Patient-count and payload limits
        remain configurable and will be agreed during the initial rollout; the planned initial target is 100
        patients per grant/batch. Authentication permits exactly one and only the known home HMO. PCM resolves the
        Contract service and enforces its workflow-specific cardinality, application entitlement and current invocation
        prerequisites. Duplicate semantic identifiers are rejected.
    DiscoveryAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 1
          items:
            oneOf:
            - $ref: '#/components/schemas/ContractFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ContractFhirContext'
            minContains: 1
            maxContains: 1
          maxItems: 1
      description: Contract-only request issued within the PCM authentication/discovery flow. PCM derives the representative
        from the already authenticated server-side flow context. No patient, representative identifier or session
        handle is accepted from the caller. Missing or expired authenticated flow context is invalid_authorization_details;
        standalone external requests cannot create that context.
    RequestedAuthorizationDetails:
      type: array
      minItems: 1
      items:
        oneOf:
        - $ref: '#/components/schemas/ConsentAuthorizationRequest'
        - $ref: '#/components/schemas/PatientPolicyAuthorizationRequest'
        - $ref: '#/components/schemas/DiscoveryAuthorizationRequest'
      maxItems: 1
      description: Exactly one PCM RAR object. The referenced Contract service selects the workflow; unknown types, roles, fields,
        mismatched shapes and unimplemented scenarios are rejected. Central resources use stable business identifiers.
        Caller-supplied HealthcareService, Group, purpose and organization are prohibited.
    AuthorizationDetailsFormValue:
      type: string
      contentMediaType: application/json
      contentSchema:
        $ref: '#/components/schemas/RequestedAuthorizationDetails'
      description: Serialize RequestedAuthorizationDetails as JSON, then form-encode this string once. PCM SHALL
        parse and validate the decoded JSON with the contentSchema; JSON Schema content keywords are not a substitute
        for runtime parsing. Duplicate JSON keys, singleton form parameters and semantic context items are rejected.
        Decoded authorization_details and token-form payload limits remain configurable and will be agreed during
        the initial rollout.
    AuthorizationPurposeCoding:
      type: object
      additionalProperties: false
      required:
      - system
      - code
      properties:
        system:
          type: string
          format: uri
        code:
          type: string
          minLength: 1
        display:
          type: string
    ConsentAuthorizationDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      - purposeOfUse
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 3
          items:
            oneOf:
            - $ref: '#/components/schemas/ConsentFhirContext'
            - $ref: '#/components/schemas/PatientFhirContext'
            - $ref: '#/components/schemas/HealthcareServiceFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ConsentFhirContext'
            minContains: 1
            maxContains: 1
          - contains:
              $ref: '#/components/schemas/PatientFhirContext'
            minContains: 1
            maxContains: 1
          - contains:
              $ref: '#/components/schemas/HealthcareServiceFhirContext'
            minContains: 1
            maxContains: 1
          maxItems: 3
        purposeOfUse:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - system
            - code
            properties:
              system:
                type: string
                const: http://terminology.hl7.org/CodeSystem/v3-ActReason
              code:
                type: string
                const: TREAT
              display:
                type: string
          maxItems: 1
    PresenceAuthorizationDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      - purposeOfUse
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 2
          items:
            oneOf:
            - $ref: '#/components/schemas/ContractFhirContext'
            - $ref: '#/components/schemas/PatientFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ContractFhirContext'
            minContains: 1
            maxContains: 1
          - contains:
              $ref: '#/components/schemas/PatientFhirContext'
            minContains: 1
        purposeOfUse:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - system
            - code
            properties:
              system:
                type: string
                const: http://pcm.fhir.health.gov.il/cs/pcm-authorization-scenario
              code:
                type: string
                const: presence-check
              display:
                type: string
          maxItems: 1
    AuthenticationAuthorizationDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      - purposeOfUse
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 2
          items:
            oneOf:
            - $ref: '#/components/schemas/ContractFhirContext'
            - $ref: '#/components/schemas/PatientFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ContractFhirContext'
            minContains: 1
            maxContains: 1
          - contains:
              $ref: '#/components/schemas/PatientFhirContext'
            minContains: 1
            maxContains: 1
          maxItems: 2
        purposeOfUse:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - system
            - code
            properties:
              system:
                type: string
                const: http://pcm.fhir.health.gov.il/cs/pcm-authorization-scenario
              code:
                type: string
                const: patient-authentication
              display:
                type: string
          maxItems: 1
    DiscoveryAuthorizationDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - fhirContext
      - purposeOfUse
      properties:
        type:
          type: string
          const: https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        fhirContext:
          type: array
          minItems: 2
          items:
            oneOf:
            - $ref: '#/components/schemas/ContractFhirContext'
            - $ref: '#/components/schemas/DiscoveryRepresentativeFhirContext'
          uniqueItems: true
          allOf:
          - contains:
              $ref: '#/components/schemas/ContractFhirContext'
            minContains: 1
            maxContains: 1
          - contains:
              $ref: '#/components/schemas/DiscoveryRepresentativeFhirContext'
            minContains: 1
            maxContains: 1
          maxItems: 2
        purposeOfUse:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - system
            - code
            properties:
              system:
                type: string
                const: http://pcm.fhir.health.gov.il/cs/pcm-authorization-scenario
              code:
                type: string
                const: dependent-discovery
              display:
                type: string
          maxItems: 1
    EffectiveAuthorizationDetails:
      type: array
      minItems: 1
      items:
        oneOf:
        - $ref: '#/components/schemas/ConsentAuthorizationDetails'
        - $ref: '#/components/schemas/PresenceAuthorizationDetails'
        - $ref: '#/components/schemas/AuthenticationAuthorizationDetails'
        - $ref: '#/components/schemas/DiscoveryAuthorizationDetails'
      maxItems: 1
      description: PCM-derived grant context. Contract and Consent basis items, and Consent HealthcareService items, use stable
        identifiers; there is no top-level fhirContext. Only the four current scenarios are accepted. The source
        SHALL interpret context by role and enforce the effective scopes. Resource identity equality and scope/context
        consistency are runtime requirements.
    BasicTokenResponse:
      type: object
      description: |
        Opaque release-1 access-token response. No token class returns a refresh
        token. For standalone SMART, `scope` reports the app-launch grant returned
        to the client; a Data Source obtains the authoritative, service-derived
        enforcement scope from active introspection. Tokens remain Bearer tokens
        even when the client assertion used for issuance contains `cnf`.
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      - scope
      properties:
        access_token:
          type: string
          description: Opaque bearer token reusable at its one authorized audience/resource server until expiry.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: |
            PCM access-token lifetime in seconds. Production issues 30
            seconds. The test environment issues 86400 seconds (24 hours), so an
            onboarding organization is not re-minting a token per call. Clients MUST
            read this value and MUST NOT assume a fixed lifetime: the two environments
            differ by more than three orders of magnitude, and a client that hardcodes
            either one breaks in the other.
          examples:
          - 30
          - 86400
        scope:
          type: string
          description: |
            Scope associated with this client-facing token response. For a
            standalone SMART response this is the app-launch grant, which can be
            broader or otherwise different from the service-derived effective
            scope returned to a Data Source through introspection.
    DataSourceTokenResponse:
      type: object
      description: Opaque Bearer data-access token response. The effective scope and enriched
        authorization_details are fixed at issuance and returned unchanged by active introspection.
        PCM invalidates the token when current authorization narrows or ceases to permit that grant.
        No refresh token is issued.
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      - scope
      - authorization_details
      properties:
        access_token:
          type: string
          description: Opaque bearer token reusable at its one authorized audience/resource server until expiry.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Lifetime in seconds, bounded by every known authorization deadline. Default maximum 30 in
            production, 86400 in test. Callers SHALL use this returned value; PCM may issue a shorter token.
          examples:
          - 30
          - 86400
        scope:
          type: string
          description: Authoritative compiled SMART scope, identical to the decision exposed by introspection.
            PCM freezes the issued scope; a narrowing dependency change invalidates the token rather than widening
            or replacing its grant in place.
        authorization_details:
          $ref: '#/components/schemas/EffectiveAuthorizationDetails'
      allOf:
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ConsentAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            scope:
              type: string
              pattern: ^patient/
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PresenceAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            scope:
              $ref: '#/components/schemas/PresenceScope'
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/AuthenticationAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            scope:
              type: string
              const: patient/Patient.s?_security=http://fhir.health.gov.il/cs/il-hdp-information-buckets|patientDemographics
      - if:
          properties:
            authorization_details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DiscoveryAuthorizationDetails'
              maxItems: 1
        then:
          properties:
            scope:
              type: string
              pattern: ^system/Patient\.s\?_has:RelatedPerson:patient:identifier=[^&\s]+&_security=http://fhir\.health\.gov\.il/cs/il-hdp-information-buckets\|patientDemographics system/RelatedPerson\.s\?identifier=[^&\s]+&_security=http://fhir\.health\.gov\.il/cs/il-hdp-information-buckets\|patientDemographics&_tag=http://fhir\.health\.gov\.il/cs/il-hdp-resource-tags\|hmo-dependent-discovery$
  responses:
    OAuthError:
      description: OAuth2 error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            invalidRequest:
              summary: Missing required parameter
              value:
                error: invalid_request
                error_description: Missing resource parameter (RFC 8707)
    TokenRequestError:
      description: OAuth2 token-request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            invalidRequest:
              summary: Malformed or ambiguous token request
              value:
                error: invalid_request
                error_description: Request does not match one supported token-request shape
            invalidGrant:
              summary: Invalid, expired, reused, or mismatched authorization code
              value:
                error: invalid_grant
                error_description: Authorization code or PKCE verifier is invalid
            unauthorizedClient:
              summary: Client is not eligible for the requested grant or role
              value:
                error: unauthorized_client
                error_description: Client is not authorized for this token class
            invalidScope:
              summary: Unsupported or excessive scope
              value:
                error: invalid_scope
                error_description: Requested scope is not supported for this token class
            invalidTarget:
              summary: Invalid resource target
              value:
                error: invalid_target
                error_description: Supply exactly one registered resource for this token class
            invalidAuthorizationDetails:
              summary: Invalid authorization basis, context or authentication session
              value:
                error: invalid_authorization_details
                error_description: Authorization details are invalid or ineligible
    InvalidClient:
      description: OAuth2 client-authentication failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            invalidClient:
              summary: Invalid client assertion
              value:
                error: invalid_client
                error_description: Missing or invalid client_assertion, including a supplied cnf that
                  does not match the mTLS certificate
    IntrospectionInvalidRequest:
      description: Malformed introspection request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            invalidRequest:
              summary: Missing subject token or ambiguous caller authentication
              value:
                error: invalid_request
                error_description: Supply a subject token and exactly one supported caller-authentication
                  method
    IntrospectionUnauthorized:
      description: Invalid direct assertion or bearer caller credential
      headers:
        WWW-Authenticate:
          description: Bearer invalid_token challenge when bearer caller authentication fails.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            invalidClient:
              summary: Invalid direct private_key_jwt authentication
              value:
                error: invalid_client
                error_description: Invalid introspection client assertion
            invalidToken:
              summary: Invalid introspection-authentication bearer token
              value:
                error: invalid_token
                error_description: Caller bearer token is missing, inactive, or has the wrong audience
    IntrospectionForbidden:
      description: Authenticated caller is not authorized for Data Source introspection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorBody'
          examples:
            insufficientScope:
              value:
                error: insufficient_scope
                error_description: Active Data Source introspection authorization is required
