openapi: 3.1.0
info:
  title: PCM OAuth2 API
  version: 0.4.2
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |-
    OpenAPI definition for the PCM OAuth2 endpoints (token issuance and introspection).
    The production PCM OAuth base is `https://pcm2m.health.gov.il/api/fhir-service/r4`
    and the test base is `https://pcm2mtest.health.gov.il/api/fhir-service/r4`; other
    deployments use their assigned environment base. Participant hosts under
    `example.org` are placeholders. Exact-match requirements apply to the applicable
    runtime values. Canonical, identifier-system, and other named protocol URIs
    remain the published identifiers.
    PCM requires mTLS on API connections, including OAuth/SMART discovery,
    token and introspection. Browser authorization and associated login/approval pages use HTTPS without requiring a client certificate. The client certificate is not
    the OAuth2 client authentication method. OAuth2 client authentication uses
    `private_key_jwt` using ES256 or ES384 and optional signing-key kid. Initial Data Source-only fallback onboarding registers one
    organization certificate and one Data Source client ID. Later manual Service
    Provider enablement may add role/application-specific certificates and client
    IDs; the calling client uses its assigned credential set. FHIR API access uses
    normal OAuth2 bearer tokens; PCM does not advertise RFC 8705
    certificate-bound access tokens. MoH/PCM exclusively controls participant
    Organization.active. A Data Source controls runtime technical availability
    through the status of its currently referenced participant Endpoint.
     Release 0.4.2 uses authentication-only private_key_jwt for every grant and RFC 9396 authorization_details for Consent and system-policy Data Source access. Legacy B2B assertion extensions and top-level introspection fhirContext are not accepted.
servers:
- url: https://pcm2mtest.health.gov.il/api/fhir-service/r4
  description: Test PCM OAuth2 origin. API calls require mTLS; browser authorization uses HTTPS without a client certificate.
- url: https://pcm2m.health.gov.il/api/fhir-service/r4
  description: Production PCM OAuth2 origin. API calls require mTLS; browser authorization uses HTTPS without a client certificate.
tags:
- name: OAuth2
  description: Token issuance and introspection.
paths:
  /.well-known/oauth-authorization-server/api/fhir-service/r4:
    servers:
    - url: https://pcm2mtest.health.gov.il
      description: Test PCM origin for RFC 8414 discovery.
    - url: https://pcm2m.health.gov.il
      description: Production PCM origin for RFC 8414 discovery.
    get:
      tags:
      - OAuth2
      operationId: getOAuthAuthorizationServerMetadataRfc8414
      summary: OAuth2 authorization server metadata at the RFC 8414 location
      description: >-
        Returns the same metadata as the compatibility alias under the PCM base.
        RFC 8414 inserts the well-known segment before the issuer path.
        Both locations require mTLS and return the same environment-specific issuer.
      security:
      - mtlsTransport: []
      responses:
        '200':
          $ref: '#/paths/~1.well-known~1oauth-authorization-server/get/responses/200'
        '400':
          $ref: '#/components/responses/OAuthError'
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - OAuth2
      operationId: getOAuthAuthorizationServerMetadata
      summary: OAuth2 authorization server metadata compatibility alias
      description: |
        Returns OAuth2 authorization server metadata for the PCM issuer, including
        authorization, token, and introspection endpoint locations. The metadata
        request itself requires mTLS. This compatibility alias appends the well-known
        segment to the PCM base; the RFC 8414 location is
        `/.well-known/oauth-authorization-server/api/fhir-service/r4` at the environment origin.
      security:
      - mtlsTransport: []
      responses:
        '200':
          description: OAuth2 authorization server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationServerMetadata'
              examples:
                metadataProduction:
                  summary: Authorization-server metadata — production
                  value:
                    issuer: https://pcm2m.health.gov.il/api/fhir-service/r4
                    authorization_endpoint: https://pcm2m.health.gov.il/api/fhir-service/r4/authorize
                    token_endpoint: https://pcm2m.health.gov.il/api/fhir-service/r4/token
                    introspection_endpoint: https://pcm2m.health.gov.il/api/fhir-service/r4/introspect
                    grant_types_supported:
                    - client_credentials
                    - authorization_code
                    response_types_supported:
                    - code
                    response_modes_supported:
                    - query
                    code_challenge_methods_supported:
                    - S256
                    token_endpoint_auth_methods_supported:
                    - private_key_jwt
                    token_endpoint_auth_signing_alg_values_supported:
                    - ES256
                    - ES384
                    introspection_endpoint_auth_methods_supported:
                    - private_key_jwt
                    introspection_endpoint_auth_signing_alg_values_supported:
                    - ES256
                    - ES384
                    tls_client_certificate_bound_access_tokens: false
                    authorization_details_types_supported:
                    - https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
                metadataTest:
                  summary: Authorization-server metadata — test
                  value:
                    issuer: https://pcm2mtest.health.gov.il/api/fhir-service/r4
                    authorization_endpoint: https://pcm2mtest.health.gov.il/api/fhir-service/r4/authorize
                    token_endpoint: https://pcm2mtest.health.gov.il/api/fhir-service/r4/token
                    introspection_endpoint: https://pcm2mtest.health.gov.il/api/fhir-service/r4/introspect
                    grant_types_supported:
                    - client_credentials
                    - authorization_code
                    response_types_supported:
                    - code
                    response_modes_supported:
                    - query
                    code_challenge_methods_supported:
                    - S256
                    token_endpoint_auth_methods_supported:
                    - private_key_jwt
                    token_endpoint_auth_signing_alg_values_supported:
                    - ES256
                    - ES384
                    introspection_endpoint_auth_methods_supported:
                    - private_key_jwt
                    introspection_endpoint_auth_signing_alg_values_supported:
                    - ES256
                    - ES384
                    tls_client_certificate_bound_access_tokens: false
                    authorization_details_types_supported:
                    - https://pcm.fhir.health.gov.il/authorization-details/fhir-data-access
        '400':
          $ref: '#/components/responses/OAuthError'
  /authorize:
    get:
      tags:
      - OAuth2
      operationId: authorizeSmartApplication
      summary: Start standalone SMART authorization using GET
      description: |
        Starts the standalone SMART authorization-code flow using browser navigation
        with URL-encoded query parameters. PCM also supports POST /authorize with
        the same parameters in an application/x-www-form-urlencoded browser form body.
        The client uses its
        assigned Service Provider application `client_id`, exact registered
        redirect URI, PKCE S256, and the exact PCM FHIR base as `aud`. The client
        requests the standard SMART App Launch v2 patient-level resource scopes
        needed by the application as one space-delimited `scope` value. PCM does
        not support `user/...` app-launch scopes and may grant a different or
        narrower scope set. The subsequent client-facing token response reports the
        app-launch grant, while the authoritative service-derived permissions
        presented to a Data Source are returned in that Data Source's active
        introspection response. A client assertion is not sent to this endpoint;
        asymmetric client authentication occurs during the code exchange. The
        browser authorization request and associated interactive login/approval pages
        use HTTPS without requiring a client certificate. The redirect callback
        must also be reachable without a client certificate. The application backend
        performs discovery and the token exchange over mTLS using its registered
        credentials. PKCE S256, state validation, and exact registered redirect-URI
        matching remain required. PAR is not introduced.
      security: []
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/response_type'
      - name: client_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/client_id'
        description: Opaque PCM-assigned OAuth client identifier for the Service Provider application.
      - name: redirect_uri
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/redirect_uri'
        description: Exact registered standalone SMART redirect URI.
      - name: scope
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/scope'
        description: |
          Space-delimited SMART App Launch v2 patient-level resource-scope
          string. PCM accepts standard `patient/...` SMART v2 syntax and does
          not support `user/...` app-launch scopes. Query-constrained FHIR
          resource scopes may use search modifiers, chaining, and reverse
          chaining, including the experimental syntax described by SMART;
          `_filter` is not supported. URL-encode the complete parameter value so
          `&` characters inside a scope constraint are not parsed as separate
          authorization-request parameters. The requested scopes remain subject
          to client, user, service-definition, and PCM authorization policy.
      - name: state
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/state'
        description: Unpredictable client-generated value validated after redirect.
      - name: code_challenge
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/code_challenge'
      - name: code_challenge_method
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/code_challenge_method'
      - name: aud
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SmartAuthorizationRequest/properties/aud'
        description: Exact PCM FHIR REST API base for the environment being called. A request to
          the test authorization endpoint must carry the test base; a request to production must
          carry the production base. Never mix the two within one flow.
      responses:
        '200':
          description: Interactive authorization or consent page when user interaction is required.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: |
            Redirect to the exact registered `redirect_uri` with `code` and the
            original `state`, or with an OAuth `error` and `state`. PCM does not
            redirect to an unregistered or mismatched URI.
          headers:
            Location:
              description: Registered redirect URI carrying the authorization response.
              schema:
                type: string
                format: uri
              examples:
                success:
                  summary: Successful authorization response
                  value: https://app.hospital-a.example.org/pcm/oauth2/callback?code=pcm-auth-code-7f3a9c&state=pcm-state-4e8b2d
                error:
                  summary: Authorization error response
                  value: https://app.hospital-a.example.org/pcm/oauth2/callback?error=access_denied&state=pcm-state-4e8b2d
        '400':
          $ref: '#/components/responses/OAuthError'
    post:
      tags:
      - OAuth2
      operationId: authorizeSmartApplicationPost
      summary: Start standalone SMART authorization using POST
      description: |
        Starts the same standalone SMART authorization-code flow as GET /authorize.
        The application submits the authorization parameters through the browser as
        an application/x-www-form-urlencoded form body instead of a query string.
        The required parameters, client-selected patient-level scopes, authorization
        policy, exact environment-specific aud, PKCE S256, state validation, and
        exact registered redirect-URI matching are the same for both methods.
        URL-encode each complete form value once, including scope constraints
        containing ampersands. Browser authorization, associated login/approval
        pages, and the redirect callback use HTTPS without a client certificate.
        Do not send a client assertion to this endpoint. The confidential application
        backend exchanges the resulting code at POST /token over mTLS using a fresh
        private_key_jwt and the matching PKCE verifier. PAR is not introduced.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SmartAuthorizationRequest'
            examples:
              standaloneSmartProduction:
                summary: Standalone SMART authorization — production
                description: Replace the illustrative client ID and callback with registered values and generate a fresh state and PKCE challenge for each flow.
                value:
                  response_type: code
                  client_id: pcm-client-hospital-a
                  redirect_uri: https://app.hospital-a.example.org/pcm/oauth2/callback
                  scope: patient/*.rs
                  state: pcm-state-4e8b2d
                  code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
                  code_challenge_method: S256
                  aud: https://pcm2m.health.gov.il/api/fhir-service/r4
      responses:
        '200':
          $ref: '#/paths/~1authorize/get/responses/200'
        '302':
          $ref: '#/paths/~1authorize/get/responses/302'
        '400':
          $ref: '#/components/responses/OAuthError'
  /token:
    post:
      tags:
      - OAuth2
      operationId: issueAccessToken
      summary: Issue access token
      description: |-
        Issues opaque Bearer tokens over mandatory mTLS. All clients authenticate using a fresh ES256 or ES384 private_key_jwt with the authentication-only ClientAssertionClaims schema. Unknown claims and extensions.hl7-b2b are rejected. Assertion aud is this environment's exact /token URL; exp-iat is at most 300 seconds; jti is single-use. Optional cnf correlates the observed mTLS certificate; it does not bind access tokens.

        Management and introspection-caller grants retain scope=system/*.crus and their respective exact resources. They do not include authorization_details. Authorization-code requests retain their existing code/PKCE contract and authentication-only assertion.

        Data Source client_credentials requests SHALL include one resource, one coarse unfiltered scope string and one form parameter authorization_details containing a JSON array with exactly one PCM object. Consent requests supply only the Consent business identifier. Presence/authentication supply a Contract plus Patient identifiers. Discovery supplies only its Contract; PCM derives the representative from the successful authentication context already held by the same PCM flow. No session handle or representative identifier is added to the wire request. Caller-supplied service, purpose, organization or population is prohibited. Unknown or mixed context shapes and duplicate JSON keys/items are invalid_authorization_details; duplicate singleton form parameters or mixed legacy/RAR requests are invalid_request.

        PCM derives caller identity from registration, resolves the basis and any Consent service, validates current organization/client/Contract or Consent eligibility and the target's active Endpoint, and compiles scope. Requested permissions and authoritative policy are intersected; unsupported or excessive resource/interaction requests are invalid_scope. Equivalent constraints within one scope are conjunctive; separate complete scopes grant a union. A token targets exactly one active Endpoint.address; missing/repeated/mismatched/inactive targets are invalid_target. No URI-prefix or redirect equivalence is permitted.

        Every effective resource scope for presence, authentication and dependent discovery SHALL include _security=http://fhir.health.gov.il/cs/il-hdp-information-buckets|patientDemographics. The discovery RelatedPerson scope SHALL also include _tag=http://fhir.health.gov.il/cs/il-hdp-resource-tags|hmo-dependent-discovery. These constraints are not repeated in the coarse requested scopes or FHIR queries. The Patient discovery scope retains its identifier-based reverse chain; PCM filters candidate eligibility using the same matching RelatedPerson record.

        Presence accepts one or more distinct supported patient identifiers. PCM ensures that only patients who have accepted the applicable EULA, including agreement to information-source-list management, are queried. This applies to each patient in individual and batch queries, including dependents. Authentication accepts exactly one identifier and only its known home HMO. Discovery issuance runs within the same PCM flow after successful authentication, using server-side identity and freshness context bound to that application and invocation. The internal PCM issuance integration passes this trusted context directly to the authorization service; it is not an unauthenticated header, caller-supplied identifier or additional form field. A standalone external token request without this trusted context is rejected. Auth/discovery target only currently enrolled active HMO sources. Contract status SHALL be executed and now SHALL fall within applies (inclusive boundaries; optional end). The immutable Contract.subType selects the workflow and purpose; the recipient SHALL match the caller's registered system organization. The target Data Source SHALL be explicitly listed in term.asset.context.reference and have eligible source/parent Organization and current active Endpoint state. An absent asset list authorizes no sources. Read access to a Contract does not entitle a client to use it.

        Presence patient-count and payload limits, including decoded authorization_details and token-form sizes, remain configurable and will be agreed during the initial rollout. The planned initial target is 100 patients per grant/batch. No truncation is permitted. Token expiry is bounded by the environment lifetime and all known authorization deadlines, including the authenticated flow context. Responses return the effective scope and enriched authorization_details. No refresh token is issued. Unknown scenarios, including organizational sharing, are not enabled in this release.

        For Consent, PCM preserves the fixed legal policy, patient, service, approved-source and one-time-window rules. Patient compartment context comes from the derived authorization-patient item. PCM-management access remains available to otherwise eligible participants whose source Endpoint is suspended/off. Client entitlement, source-list/session prerequisites and role/ownership checks are runtime checks, not caller assertions.
      security:
      - mtlsTransport: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              authorizationCode:
                summary: "Standalone SMART authorization-code exchange — production"
                description: |
                  The client assertion is newly generated for this exchange and
                  has `iss=sub=pcm-client-hospital-a`, `aud` equal to the exact
                  PCM token endpoint, a unique `jti`, and a short expiry. The
                  compact value uses the example `ES384` header with `kid`; its
                  `ExampleSignature` segment is illustrative rather than a
                  cryptographic test vector.

                  Replace `client.crt`, `client.key` and `rootCA.crt` with the registered mTLS credentials and trusted CA bundle. Set `CLIENT_ASSERTION` to a fresh ES384-signed assertion with the registered signing-key `kid`, `aud=https://pcm2m.health.gov.il/api/fhir-service/r4/token` and a new single-use `jti`. Set `AUTHORIZATION_CODE` to the authorization code returned for this client and redirect URI. Set `PKCE_CODE_VERIFIER` to the verifier matching the authorization request's S256 challenge. Use the exact registered `redirect_uri` from the authorization request.

                  ```bash
                  curl --cert client.crt --key client.key --cacert rootCA.crt \
                    --request POST https://pcm2m.health.gov.il/api/fhir-service/r4/token \
                    --header 'Content-Type: application/x-www-form-urlencoded' \
                    --data-urlencode grant_type=authorization_code \
                    --data-urlencode "code=$AUTHORIZATION_CODE" \
                    --data-urlencode redirect_uri=https://app.hospital-a.example.org/pcm/oauth2/callback \
                    --data-urlencode "code_verifier=$PKCE_CODE_VERIFIER" \
                    --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
                    --data-urlencode "client_assertion=$CLIENT_ASSERTION"
                  ```
                x-decoded-client-assertion:
                  header:
                    alg: ES384
                    typ: JWT
                    kid: uTBLakUt5ynLNPtV5W29qaBWglltJeByc-KEyXQHUdU
                  claims:
                    iss: pcm-client-hospital-a
                    sub: pcm-client-hospital-a
                    aud: https://pcm2m.health.gov.il/api/fhir-service/r4/token
                    iat: 1706640000
                    exp: 1706640300
                    jti: auth-code-exchange-0001
                value:
                  grant_type: authorization_code
                  code: v4LTC1JxW9Q2example
                  redirect_uri: https://app.hospital-a.example.org/pcm/oauth2/callback
                  code_verifier: 8Zp7n4mTQ2xV6cK9rB3wF5sL1yH0dJ4uN7aE6gC2iP8
                  client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  client_assertion: eyJhbGciOiJFUzM4NCIsInR5cCI6IkpXVCIsImtpZCI6InVUQkxha1V0NXluTE5QdFY1VzI5cWFCV2dsbHRKZUJ5Yy1LRXlYUUhVZFUifQ.eyJpc3MiOiJwY20tY2xpZW50LWhvc3BpdGFsLWEiLCJzdWIiOiJwY20tY2xpZW50LWhvc3BpdGFsLWEiLCJhdWQiOiJodHRwczovL3BjbTJtLmhlYWx0aC5nb3YuaWwvYXBpL2ZoaXItc2VydmljZS9yNC90b2tlbiIsImp0aSI6ImF1dGgtY29kZS1leGNoYW5nZS0wMDAxIiwiaWF0IjoxNzA2NjQwMDAwLCJleHAiOjE3MDY2NDAzMDB9.ExampleSignature
              clientCredentialsTest:
                summary: "PCM management token request without kid — test"
                description: |
                  The decoded assertion has `iss=sub=pcm-client-hospital-a`,
                  `aud=https://pcm2mtest.health.gov.il/api/fhir-service/r4/token`, a unique `jti`,
                  and no patient, Consent, service, or B2B authorization context.
                  The compact value omits `kid` and uses client-ID-based key resolution.
                  This compatibility assertion is not a SMART-profile assertion. Its
                  `ExampleSignature` segment is illustrative rather than a
                  cryptographic test vector.

                  Replace `client.crt`, `client.key` and `rootCA.crt` with the registered mTLS credentials and trusted CA bundle. Set `CLIENT_ASSERTION` to a fresh ES256-signed assertion without `kid`, with `aud=https://pcm2mtest.health.gov.il/api/fhir-service/r4/token` and a new single-use `jti`.

                  ```bash
                  curl --cert client.crt --key client.key --cacert rootCA.crt \
                    --request POST https://pcm2mtest.health.gov.il/api/fhir-service/r4/token \
                    --header 'Content-Type: application/x-www-form-urlencoded' \
                    --data-urlencode grant_type=client_credentials \
                    --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
                    --data-urlencode "client_assertion=$CLIENT_ASSERTION" \
                    --data-urlencode 'scope=system/*.crus' \
                    --data-urlencode resource=https://pcm2mtest.health.gov.il/api/fhir-service/r4
                  ```
                x-decoded-client-assertion:
                  header:
                    alg: ES256
                    typ: JWT
                  claims:
                    iss: pcm-client-hospital-a
                    sub: pcm-client-hospital-a
                    aud: https://pcm2mtest.health.gov.il/api/fhir-service/r4/token
                    iat: 1706640000
                    exp: 1706640300
                    jti: management-request-0001
                value:
                  grant_type: client_credentials
                  client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  client_assertion: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwY20tY2xpZW50LWhvc3BpdGFsLWEiLCJzdWIiOiJwY20tY2xpZW50LWhvc3BpdGFsLWEiLCJhdWQiOiJodHRwczovL3BjbTJtdGVzdC5oZWFsdGguZ292LmlsL2FwaS9maGlyLXNlcnZpY2UvcjQvdG9rZW4iLCJqdGkiOiJtYW5hZ2VtZW50LXJlcXVlc3QtMDAwMSIsImlhdCI6MTcwNjY0MDAwMCwiZXhwIjoxNzA2NjQwMzAwfQ.ExampleSignature
                  scope: system/*.crus
                  resource: https://pcm2mtest.health.gov.il/api/fhir-service/r4
              clientCredentials:
                summary: "PCM management token request — production"
                description: |
                  The decoded assertion has `iss=sub=pcm-client-hospital-a`,
                  `aud=https://pcm2m.health.gov.il/api/fhir-service/r4/token`, a unique `jti`,
                  and no patient, Consent, service, or B2B authorization context.
                  The compact value uses the example `ES256` header with `kid`; its
                  `ExampleSignature` segment is illustrative rather than a
                  cryptographic test vector.

                  Replace `client.crt`, `client.key` and `rootCA.crt` with the registered mTLS credentials and trusted CA bundle. Set `CLIENT_ASSERTION` to a fresh ES256-signed assertion with the registered signing-key `kid`, `aud=https://pcm2m.health.gov.il/api/fhir-service/r4/token` and a new single-use `jti`.

                  ```bash
                  curl --cert client.crt --key client.key --cacert rootCA.crt \
                    --request POST https://pcm2m.health.gov.il/api/fhir-service/r4/token \
                    --header 'Content-Type: application/x-www-form-urlencoded' \
                    --data-urlencode grant_type=client_credentials \
                    --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
                    --data-urlencode "client_assertion=$CLIENT_ASSERTION" \
                    --data-urlencode 'scope=system/*.crus' \
                    --data-urlencode resource=https://pcm2m.health.gov.il/api/fhir-service/r4
                  ```
                x-decoded-client-assertion:
                  header:
                    alg: ES256
                    typ: JWT
                    kid: CKo7NS1KIExQbeKkBOU1FVYOxgW-f_VB7uBxB29jZCs
                  claims:
                    iss: pcm-client-hospital-a
                    sub: pcm-client-hospital-a
                    aud: https://pcm2m.health.gov.il/api/fhir-service/r4/token
                    iat: 1706640000
                    exp: 1706640300
                    jti: management-request-0001
                value:
                  grant_type: client_credentials
                  client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  client_assertion: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6IkNLbzdOUzFLSUV4UWJlS2tCT1UxRlZZT3hnVy1mX1ZCN3VCeEIyOWpaQ3MifQ.eyJpc3MiOiJwY20tY2xpZW50LWhvc3BpdGFsLWEiLCJzdWIiOiJwY20tY2xpZW50LWhvc3BpdGFsLWEiLCJhdWQiOiJodHRwczovL3BjbTJtLmhlYWx0aC5nb3YuaWwvYXBpL2ZoaXItc2VydmljZS9yNC90b2tlbiIsImp0aSI6Im1hbmFnZW1lbnQtcmVxdWVzdC0wMDAxIiwiaWF0IjoxNzA2NjQwMDAwLCJleHAiOjE3MDY2NDAzMDB9.ExampleSignature
                  scope: system/*.crus
                  resource: https://pcm2m.health.gov.il/api/fhir-service/r4
              introspectionAuthenticationTest:
                summary: "Data Source introspection caller token request — test"
                description: |
                  This assertion has the token endpoint as its audience. The
                  resulting opaque token has the exact PCM introspection
                  endpoint as its sole audience and contains no patient,
                  Consent, service, B2B, or
                  launch context. The compact value uses the example `ES256`
