  /introspect:
    post:
      tags:
      - OAuth2
      operationId: introspectToken
      summary: Introspect access token
      description: |-
        Validates an opaque subject token for the authenticated Data Source. Mandatory mTLS and exactly one caller-authentication method apply: private_key_jwt in the form or a Bearer token issued for this exact introspection endpoint. PCM returns context only when the caller owns the token's exact current audience. Invalid, expired, wrong-audience or ineligible subject tokens return only {"active":false}.

        Every active result contains scope and the enriched authorization_details array; fhirContext is nested in its single PCM object. Top-level fhirContext, patient and cnf are prohibited. Consent callers have a derived organization_id; PCM system clients omit it. pcm_authentication_context records issuance authentication evidence and does not make tokens certificate-bound.

        PCM rechecks current client, organization, Endpoint, Consent/Contract, applicable Consent service, explicit source membership and session prerequisites. Only executed Contracts within their applies period authorize; an absent end means ongoing. Expiry denies access even before status is updated to terminated. Revoked, terminated and entered-in-error grants do not authorize. Source removal invalidates affected decisions at subsequent introspection; additions do not widen issued tokens or reactivate invalidated tokens. A state or policy change that invalidates/narrows the issued decision yields active:false; PCM never widens an existing token. Each one-time Consent/source window begins at that source's first qualifying active introspection and lasts at most one hour. Positive responses SHALL have exp no later than that window and all other known deadlines.

        Active introspection requires the target Data Source's currently referenced Endpoint to remain active and the token audience to equal its exact current address. Suspending that Endpoint, turning it off, or replacing its address so the token audience no longer matches makes affected tokens inactive at subsequent introspection without changing the Consent lifecycle. Technical unavailability does not itself deactivate or revoke the Consent.

        The HO SHALL enforce the exact audience, effective SMART scopes and applicable context on every protected request, including every batch entry and page. For patient/ scopes it resolves authorization-patient by exact system/value to one local Patient; no match or ambiguous resolution fails closed. Presence and dependent-discovery system scopes do not establish a Patient compartment. discovery-representative is descriptive identity context, not proof of eligibility for each candidate. Its identifier SHALL agree with both discovery scopes.

        The effective scope prefix is the definitive patient-context signal. For patient/ scopes the HO SHALL require exactly one authorization-patient item and establish its resolved local Patient logical id as the internal patient context, populating an internal patient element if its handler uses one. Missing context or unresolved identity denies access. This does not add a top-level patient to the PCM response. For system-only scopes the HO SHALL NOT derive a single patient context merely from Patient context items, even for one-patient presence; presence identifiers SHALL agree with the scope-defined set. Mixed patient/ and system/ scopes per Data Source-access token are unsupported and SHALL be rejected. Choosing this processing path requires only the introspection scope and context, not Contract retrieval.

        The HO SHOULD validate the Contract against its locally configured workflow using the exact system/value business identifier in authorization-basis context, checking scope/context/purpose/operation agreement and rejecting inconsistencies. This stable grant identifier is sufficient to select the configured mapping; runtime Contract retrieval is not expected. PCM derives the workflow from Contract.subType and checks current grant and dependency eligibility at issuance and introspection. Contract-based responses contain no HealthcareService context. Consent responses retain their HealthcareService context.

        PCM SHALL issue workflow-conforming queries. The HO SHALL enforce the permitted operations and maximum disclosure for the Contract workflow on every request, batch entry and page. It may reject query-shape deviations or safely impose the authorized count/projection; omitted or enlarged _elements or missing count-only parameters SHALL NOT widen disclosure. Unsupported operations SHALL be rejected. Successful responses SHALL honor the count/projection contract and agreed FHIR metadata exceptions. SMART .s alone is not a count-only or field-level permission.

        The HO SHALL enforce the effective scope's demographics bucket and applicable RelatedPerson discovery tag independently of caller filters, before calculating counts or projecting results. The RelatedPerson tag constraint does not restrict the Patient scope's reverse-chain traversal; PCM filters candidate eligibility using the same matching relationship record.

        Active introspection may be cached only until returned exp. A Data Source MAY reuse an unexpired cached active result for multiple protected requests without introspecting again for every request. It SHALL enforce the cached exact audience, effective scope and enriched authorization_details, including nested fhirContext and purposeOfUse, and all other returned restrictions on every request, including every batch entry and page. It SHALL stop using the cached result at exp. Production default token lifetime is 30 seconds; test is 86400 seconds. The cache limit is always the returned exp, not a fixed duration. The source MAY introspect more often. Positive caches bound revocation delay; test certification SHALL include production-equivalent freshness cases. Scope values and patient/session data SHALL be redacted from ordinary logs.
      security:
      - mtlsTransport: []
        bearerAuth: []
      - mtlsTransport: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
            examples:
              introspectionRequest:
                summary: "Introspect Data Source token using caller Bearer credential — production"
                description: |
                  The illustrative `token` value `8d3b1c9a-4f2a-4b9d-9b5a-6c1f4a7b2d11` matches the production
                  `/token` response and active `/introspect` response examples named `dataSourceAccess`.
                  GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.
                  The caller Bearer credential is separate: the `introspectionAuthenticationTokenResponse`
                  issuance example returns `4ed72886-df31-4fe8-a86d-1bc6f53ea493`.
                  Set `INTROSPECTION_BEARER_TOKEN` to the actual caller credential, not the subject token.

                  Replace `client.crt`, `client.key` and `rootCA.crt` with the registered mTLS credentials and trusted CA bundle. Set `SUBJECT_TOKEN` to the opaque access token being introspected. Set `INTROSPECTION_BEARER_TOKEN` to the separate caller credential issued for this environment's introspection endpoint.

                  ```bash
                  curl --cert client.crt --key client.key --cacert rootCA.crt \
                    --request POST https://pcm2m.health.gov.il/api/fhir-service/r4/introspect \
                    --header 'Content-Type: application/x-www-form-urlencoded' \
                    --header "Authorization: Bearer $INTROSPECTION_BEARER_TOKEN" \
                    --data-urlencode "token=$SUBJECT_TOKEN"
                  ```
                value:
                  token: 8d3b1c9a-4f2a-4b9d-9b5a-6c1f4a7b2d11
              privateKeyJwtIntrospection:
                summary: "Introspect Data Source token using HMO client assertion — production"
                description: |
                  The illustrative `token` value `8d3b1c9a-4f2a-4b9d-9b5a-6c1f4a7b2d11` matches the production
                  `/token` response and active `/introspect` response examples named `dataSourceAccess`.
                  GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.

                  Decoded caller assertion: `iss=sub=pcm-client-hmo-b`,
                  `aud=https://pcm2m.health.gov.il/api/fhir-service/r4/introspect`, unique `jti`,
                  and a short expiry. This caller credential is distinct from the
                  opaque subject token in `token`. The compact value uses the
                  example `ES256` header with `kid`; its `ExampleSignature` segment is
                  illustrative rather than a cryptographic test vector.

                  Replace `client.crt`, `client.key` and `rootCA.crt` with the registered mTLS credentials and trusted CA bundle. Set `CLIENT_ASSERTION` to a fresh ES256-signed assertion with the registered signing-key `kid`, `aud=https://pcm2m.health.gov.il/api/fhir-service/r4/introspect` and a new single-use `jti`. Set `SUBJECT_TOKEN` to the opaque access token being introspected.

                  ```bash
                  curl --cert client.crt --key client.key --cacert rootCA.crt \
                    --request POST https://pcm2m.health.gov.il/api/fhir-service/r4/introspect \
                    --header 'Content-Type: application/x-www-form-urlencoded' \
                    --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
                    --data-urlencode "client_assertion=$CLIENT_ASSERTION" \
                    --data-urlencode "token=$SUBJECT_TOKEN" \
                    --data-urlencode token_type_hint=access_token
                  ```
                x-decoded-client-assertion:
                  header:
                    alg: ES256
                    typ: JWT
                    kid: CKo7NS1KIExQbeKkBOU1FVYOxgW-f_VB7uBxB29jZCs
                  claims:
                    iss: pcm-client-hmo-b
                    sub: pcm-client-hmo-b
                    aud: https://pcm2m.health.gov.il/api/fhir-service/r4/introspect
                    jti: direct-introspection-0001
                    iat: 1706640000
                    exp: 1706640300
                value:
                  client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  client_assertion: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6IkNLbzdOUzFLSUV4UWJlS2tCT1UxRlZZT3hnVy1mX1ZCN3VCeEIyOWpaQ3MifQ.eyJpc3MiOiJwY20tY2xpZW50LWhtby1iIiwic3ViIjoicGNtLWNsaWVudC1obW8tYiIsImF1ZCI6Imh0dHBzOi8vcGNtMm0uaGVhbHRoLmdvdi5pbC9hcGkvZmhpci1zZXJ2aWNlL3I0L2ludHJvc3BlY3QiLCJqdGkiOiJkaXJlY3QtaW50cm9zcGVjdGlvbi0wMDAxIiwiaWF0IjoxNzA2NjQwMDAwLCJleHAiOjE3MDY2NDAzMDB9.ExampleSignature
                  token: 8d3b1c9a-4f2a-4b9d-9b5a-6c1f4a7b2d11
                  token_type_hint: access_token
              introspectRequestBearer:
                summary: "Bearer-authenticated introspection with token type hint — production"
                description: |
                  The illustrative `token` value `8d3b1c9a-4f2a-4b9d-9b5a-6c1f4a7b2d11` matches the production
                  `/token` response and active `/introspect` response examples named `dataSourceAccess`.
                  GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.
                  The caller Bearer credential is separate: the `introspectionAuthenticationTokenResponse`
                  issuance example returns `4ed72886-df31-4fe8-a86d-1bc6f53ea493`.
                  Set `INTROSPECTION_BEARER_TOKEN` to the actual caller credential, not the subject token.

                  Replace `client.crt`, `client.key` and `rootCA.crt` with the registered mTLS credentials and trusted CA bundle. Set `SUBJECT_TOKEN` to the opaque access token being introspected. Set `INTROSPECTION_BEARER_TOKEN` to the separate caller credential issued for this environment's introspection endpoint.

                  ```bash
                  curl --cert client.crt --key client.key --cacert rootCA.crt \
                    --request POST https://pcm2m.health.gov.il/api/fhir-service/r4/introspect \
                    --header 'Content-Type: application/x-www-form-urlencoded' \
                    --header "Authorization: Bearer $INTROSPECTION_BEARER_TOKEN" \
                    --data-urlencode "token=$SUBJECT_TOKEN" \
                    --data-urlencode token_type_hint=access_token
