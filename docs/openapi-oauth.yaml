      responses:
        '200':
          description: Access token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                standaloneSmartAccessTokenResponse:
                  summary: "Standalone SMART access token — production (30 seconds)"
                  description: |
                    `scope` reports the app-launch grant returned to the client.
                    It is not the Data Source's final enforcement scope. PCM derives
                    the effective permissions from the applicable service
                    definition and returns them to the Data Source through active
                    token introspection.

                    GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.
                  value:
                    access_token: 9d984f7d-c183-49f1-9b7b-9d7426204f17
                    token_type: Bearer
                    expires_in: 30
                    scope: patient/*.rs
                pcmAccessTokenResponse:
                  summary: "PCM management access token — production (30 seconds)"
                  description: |
                    GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.
                  value:
                    access_token: 2f1b8b7e-2d1a-4b0b-9e9a-9f02a7b3b6a1
                    token_type: Bearer
                    expires_in: 30
                    scope: system/*.crus
                introspectionAuthenticationTokenResponse:
                  summary: "Data Source introspection caller token — production (30 seconds)"
                  description: |
                    GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.
                  value:
                    access_token: 4ed72886-df31-4fe8-a86d-1bc6f53ea493
                    token_type: Bearer
                    expires_in: 30
                    scope: system/*.crus
                dataSourceAccess:
                  summary: "Data Source access token — production (30 seconds)"
                  description: |
                    Corresponds to the `dataSourceAccess` token request example in production; `dataSourceAccessTest` is its counterpart in the other environment. The production default lifetime is 30 seconds and the test default is 86400 seconds (24 hours). Clients must use the returned `expires_in` rather than assume either default. `scope` contains the effective permissions and authorization predicates compiled by PCM, rather than just the unfiltered requested scope. `authorization_details` contains the resolved Consent basis and enriched Patient, HealthcareService and purpose context. The same effective grant is returned by active introspection while its authorization remains valid. The access token is opaque and is sent as a Bearer token to the selected Data Source. No refresh token is issued.

                    GUID-shaped token values are illustrative. Actual tokens are opaque strings; clients must not assume a GUID format or interpret their contents.
                  value:
                    access_token: 8d3b1c9a-4f2a-4b9d-9b5a-6c1f4a7b2d11
