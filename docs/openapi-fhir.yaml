          required: [resourceType, id, meta, identifier, active, type, name]
          properties:
            resourceType:
              type: string
              const: Organization
            id:
              type: string
              readOnly: true
            meta:
              allOf:
                - $ref: '#/components/schemas/PCMResponseMeta'
                - type: object
                  properties:
                    profile:
                      contains:
                        const: http://pcm.fhir.health.gov.il/StructureDefinition/pcm-organization-system
                      minContains: 1
                      maxContains: 1
            active:
              type: boolean
              const: true
            identifier:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMMohInstitutionIdentifier'
            type:
              type: array
              minItems: 2
              contains:
                $ref: '#/components/schemas/PCMSystemOrganizationType'
              minContains: 1
              maxContains: 1
              items:
                $ref: '#/components/schemas/CodeableConcept'
            name:
              type: string
            endpoint:
              type: array
              items:
                $ref: '#/components/schemas/PCMLiteralReference'
            contact:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/OrganizationContact'
                  - type: object
                    required: [purpose]
            alias: false
            partOf: false

    PCMOrganization:
      anyOf:
        - $ref: '#/components/schemas/PCMOrganizationParent'
        - $ref: '#/components/schemas/PCMOrganizationServiceProvider'
        - $ref: '#/components/schemas/PCMOrganizationDataSource'
        - $ref: '#/components/schemas/PCMOrganizationSystem'

    PCMOrganizationServiceProviderCreateRequest:
      description: |
        Closed Service Provider child creation projection. The caller supplies the
        requested child name, purpose-coded contact overrides, and ordinary unknown
        non-modifier extensions. PCM derives Parent, role, identity, active state,
        OAuth redirect projection, and certificate inventory. The accepted name
        becomes authoritative. Supplying another PCM-managed field rejects the
        complete request. A create id is ignored; version/timestamp metadata is
        prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, name]
      properties:
        resourceType:
          type: string
          const: Organization
        id:
          type: string
          description: Optional FHIR create metadata; ignored by PCM.
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        name:
          type: string
          minLength: 1
        extension:
          type: array
          description: Unknown ordinary non-modifier extensions only.
          items:
            $ref: '#/components/schemas/Extension'
          not:
            contains:
              type: object
              required: [url]
              properties:
                url:
                  enum:
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-oauth2-redirect-uri
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PCMOrganizationRequestContact'

    PCMOrganizationParentUpdateRequest:
      description: |
        Closed Parent contact-replacement projection. The request repeats the
        unchanged authoritative name required by base FHIR Organization; PCM rejects
        a mismatch. Identity, classification, address, telecom, active, and known
        PCM-managed extensions, `meta.versionId`, and `meta.lastUpdated` are
        prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, id, name]
      properties:
        resourceType:
          type: string
          const: Organization
        id:
          type: string
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        name:
          type: string
          minLength: 1
          description: Unchanged authoritative Parent name; this request does not rename it.
        extension:
          type: array
          description: Unknown ordinary non-modifier extensions only.
          items:
            $ref: '#/components/schemas/Extension'
          not:
            contains:
              type: object
              required: [url]
              properties:
                url:
                  enum:
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-oauth2-redirect-uri
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PCMOrganizationRequestContact'

    PCMOrganizationServiceProviderUpdateRequest:
      description: |
        Closed Service Provider contact-replacement projection. The request repeats
        the unchanged authoritative name required by base FHIR Organization; PCM
        rejects a mismatch. Identity, type, Parent link, active state, redirect
        projection, certificate inventory, `meta.versionId`, and `meta.lastUpdated`
        are prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, id, name]
      properties:
        resourceType:
          type: string
          const: Organization
        id:
          type: string
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        name:
          type: string
          minLength: 1
          description: Unchanged authoritative Service Provider name; this request does not rename it.
        extension:
          type: array
          description: Unknown ordinary non-modifier extensions only.
          items:
            $ref: '#/components/schemas/Extension'
          not:
            contains:
              type: object
              required: [url]
              properties:
                url:
                  enum:
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-oauth2-redirect-uri
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PCMOrganizationRequestContact'

    PCMOrganizationDataSourceUpdateRequest:
      description: |
        Closed Data Source Endpoint/contact-replacement projection. The Endpoint
        reference must identify the source's own registered Endpoint. The request
        repeats the unchanged authoritative name required by base FHIR Organization;
        PCM rejects a mismatch. Identity, type, Parent link, active state, and known
        PCM-managed extensions, `meta.versionId`, and `meta.lastUpdated` are
        prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, id, name, endpoint]
      properties:
        resourceType:
          type: string
          const: Organization
        id:
          type: string
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        name:
          type: string
          minLength: 1
          description: Unchanged authoritative Data Source name; this request does not rename it.
        extension:
          type: array
          description: Unknown ordinary non-modifier extensions only.
          items:
            $ref: '#/components/schemas/Extension'
          not:
            contains:
              type: object
              required: [url]
              properties:
                url:
                  enum:
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-oauth2-redirect-uri
                    - http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        endpoint:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMLiteralReference'
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PCMOrganizationRequestContact'

    PCMOrganizationUpdateRequest:
      anyOf:
        - $ref: '#/components/schemas/PCMOrganizationParentUpdateRequest'
        - $ref: '#/components/schemas/PCMOrganizationServiceProviderUpdateRequest'
        - $ref: '#/components/schemas/PCMOrganizationDataSourceUpdateRequest'

    OAuth2RedirectUriExtension:
      type: object
      readOnly: true
      description: PCM-managed read-only projection of the redirect URI registered for the primary standalone SMART application.
      required: [url, valueUrl]
      properties:
        url:
          type: string
          const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-oauth2-redirect-uri
        valueUrl:
          type: string
          format: uri
          description: Exact redirect URI held in PCM's authoritative OAuth client registration.

    PCMApplicableCertificatesExtension:
      type: object
      additionalProperties: false
      readOnly: true
      description: |
        PCM-managed projection of one or more certificate thumbprints explicitly
        associated with the resource under the current participant-registration
        policy. This is certificate inventory metadata; it does not describe the
        complete trust store, prove current certificate presentation or
        authorization, identify which certificate was used for a particular OAuth
        exchange, or declare an RFC 8705 certificate-bound access token.
        Client-supplied values are prohibited in create/update request schemas.
      required: [url, extension]
      properties:
        url:
          type: string
          const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        extension:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PCMApplicableCertificateThumbprintExtension'

    PCMApplicableCertificateThumbprintExtension:
      type: object
      additionalProperties: false
      required: [url, valueString]
      properties:
        url:
          type: string
          const: thumbprint
        valueString:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Base64url-encoded SHA-256 thumbprint of the DER-encoded X.509 certificate, without padding.

    PCMEndpointConnectionType:
      allOf:
        - $ref: '#/components/schemas/Coding'
        - type: object
          required: [system, code]
          properties:
            system:
              type: string
              const: http://terminology.hl7.org/CodeSystem/endpoint-connection-type
            code:
              type: string
              const: hl7-fhir-rest

    PCMEndpointPayloadType:
      allOf:
        - $ref: '#/components/schemas/CodeableConcept'
        - type: object
          required: [coding]
          properties:
            coding:
              type: array
              minItems: 1
              maxItems: 1
              items:
                allOf:
                  - $ref: '#/components/schemas/Coding'
                  - type: object
                    required: [system, code]
                    properties:
                      system:
                        type: string
                        const: http://terminology.hl7.org/CodeSystem/endpoint-payload-type
                      code:
                        type: string
                        const: any
                      display: false

    PCMEndpointCreateRequest:
      description: |
        Closed participant Endpoint creation projection. The Data Source supplies
        active/suspended status and address; PCM derives ownership and identity.
        Known PCM certificate inventory and every other business element are
        prohibited. A create id is ignored; version/timestamp metadata is prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, status, connectionType, payloadType, address]
      properties:
        resourceType:
          type: string
          const: Endpoint
        id:
          type: string
          description: Optional FHIR create metadata; ignored by PCM.
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        extension:
          type: array
          description: Unknown ordinary non-modifier extensions only.
          items:
            $ref: '#/components/schemas/Extension'
          not:
            contains:
              type: object
              required: [url]
              properties:
                url:
                  const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        status:
          type: string
          enum: [active, suspended]
        connectionType:
          $ref: '#/components/schemas/PCMEndpointConnectionType'
        payloadType:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMEndpointPayloadType'
        address:
          type: string
          format: uri

    PCMEndpointUpdateRequest:
      description: |
        Closed participant Endpoint replacement projection. The owner supplies
        status and address; PCM validates the current-state transition and address
        rule. Identity, managingOrganization, certificate inventory,
        `meta.versionId`, and `meta.lastUpdated` are prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, id, status, connectionType, payloadType, address]
      properties:
        resourceType:
          type: string
          const: Endpoint
        id:
          type: string
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        extension:
          type: array
          description: Unknown ordinary non-modifier extensions only.
          items:
            $ref: '#/components/schemas/Extension'
          not:
            contains:
              type: object
              required: [url]
              properties:
                url:
                  const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-applicable-certificates
        status:
          type: string
          enum: [active, suspended, "off"]
        connectionType:
          $ref: '#/components/schemas/PCMEndpointConnectionType'
        payloadType:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMEndpointPayloadType'
        address:
          type: string
          format: uri

    PCMEndpoint:
      description: |
        Authoritative Data Source or PCM-system FHIR REST Endpoint, optionally
        including PCM-managed associated-certificate inventory. Participant Data
        Source Endpoints use active, suspended, or off; PCM system Endpoints are
        managed separately and may use another base-FHIR status.
      allOf:
        - $ref: '#/components/schemas/Endpoint'
        - type: object
          required: [resourceType, id, meta, status, connectionType, payloadType, address, managingOrganization]
          properties:
            resourceType:
              type: string
              const: Endpoint
            id:
              type: string
              readOnly: true
            meta:
              $ref: '#/components/schemas/PCMEndpointMeta'
            status:
              type: string
              enum: [active, suspended, error, "off", entered-in-error, test]
            connectionType:
              $ref: '#/components/schemas/PCMEndpointConnectionType'
            payloadType:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMEndpointPayloadType'
            address:
              type: string
              format: uri
            managingOrganization:
              $ref: '#/components/schemas/PCMLiteralReference'
            extension:
              type: array
              allOf:
                - contains:
                    $ref: '#/components/schemas/PCMApplicableCertificatesExtension'
                  minContains: 0
                  maxContains: 1
              items:
                $ref: '#/components/schemas/Extension'
            name: false
            contact: false
            period: false
            payloadMimeType: false
            header: false

    PCMEndpointMeta:
      allOf:
        - $ref: '#/components/schemas/PCMResponseMeta'
        - type: object
          required: [profile]
          properties:
            profile:
              type: array
              contains:
                enum:
                  - http://pcm.fhir.health.gov.il/StructureDefinition/pcm-endpoint
                  - http://pcm.fhir.health.gov.il/StructureDefinition/pcm-endpoint-system
              minContains: 1
              maxContains: 1
              items:
