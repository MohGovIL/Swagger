        both optional values copied from the retrieved canonical. PCM normalizes
        proposal version/timestamp metadata, coding display text, representation
        ordering, and unknown ordinary non-modifier extensions before comparing
        all known protected fields. Unsupported
        modifier extensions are rejected.
      type: object
      additionalProperties: false
      required: [resourceType, parameter]
      properties:
