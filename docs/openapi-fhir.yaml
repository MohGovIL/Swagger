        to the catalog uniqueness check. PCM rejects any known protected-field difference in
        `category`, `type`, information buckets or history depth, tagged details,
        `accessMode`, `accessDuration`, `allowPatientBucketChange`, identifiers,
        tags, lifecycle state, linkage, or any other field as material or
        unsupported. The outer Parameters request prohibits `meta.versionId` and
        `meta.lastUpdated`; the embedded complete `proposedCatalog` may retain both
        optional values copied from the retrieved canonical. PCM removes them before
        comparison, and neither provides optimistic concurrency. Comparison is
        otherwise semantic rather than raw JSON: proposal version/timestamp metadata,
        coding display text, representation ordering, and unknown ordinary
        non-modifier extensions are neutral. Unknown ordinary extensions are accepted without interpretation or
        a round-trip guarantee; unsupported modifier extensions reject the request.
        Material changes use the new-service registration flow.
        Ordinary canonical `PUT /HealthcareService/{id}` remains unsupported.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMRequestCatalogUpdateParameters'
            examples:
              catalogUpdateRequest:
                $ref: '#/components/examples/ParametersCatalogUpdateRequest'
      responses:
        '200':
          description: Catalog update request accepted for PCM/MoH review
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMRequestCatalogUpdateAcceptedParameters'
              examples:
                catalogUpdateAccepted:
                  $ref: '#/components/examples/ParametersCatalogUpdateAccepted'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Consent:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [Consent]
      operationId: searchConsents
      summary: Search consents
      description: |
        Search consents by supported parameters. Use _include to return actor
        organizations, endpoints, and parent orgs in a single bundle.
      parameters:
        - $ref: '#/components/parameters/_id'
        - $ref: '#/components/parameters/identifier'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/patient'
        - $ref: '#/components/parameters/patient_identifier'
        - $ref: '#/components/parameters/pcm_service'
        - $ref: '#/components/parameters/pcm_business_status'
        - $ref: '#/components/parameters/_lastUpdated'
        - $ref: '#/components/parameters/Consent_include'
        - $ref: '#/components/parameters/Consent_include_iterate'
      responses:
        '200':
          description: Bundle of consents
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMConsentSearchBundle'
              examples:
                proposedByPatient:
                  $ref: '#/components/examples/ConsentProposedPatientSearchBundle'
                byService:
                  $ref: '#/components/examples/ConsentByServiceSearchBundle'
                withIncludes:
                  $ref: '#/components/examples/ConsentIncludeBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    post:
      tags: [Consent]
      operationId: createConsent
      summary: Create consent request
      description: |
        Create a proposed consent request for a patient and a service provider's
        HealthcareService instance. The `pcm-service` extension must reference an
        existing active instance service. PCM rejects requests that omit the service,
        point to a canonical catalog service, or point to an inactive or otherwise
        unusable instance. The calling Service Provider child Organization must be
        operationally active: the child and Parent are active and all documented
        policy preconditions permit use. Token issuance later repeats Organization and service
        state checks, so an
        existing active Consent does not authorize data-source access after the
        Service Provider, target Data Source, service instance, or referenced catalog
        becomes inactive/non-usable. The accepted request shape is documented
        by the interaction-specific `pcm-consent-submit` server validation profile;
        its canonical is not required in request `meta.profile`.
        `scope=patient-privacy`, `category=INFA`, and the fixed legal `policy` are
        mandatory on submit. Created/read response examples use the returned
        `pcm-consent` profile. Every other Consent business element is prohibited in
        the request and rejects the whole request.
        The selected service supplies the initial requested/default access mode and
        maximum duration. An authorized patient decision, including an assisted or
        delegated flow outside this client API, may narrow continuous access to
        one-time and/or approve a shorter period or later shorten it. The authoritative
        returned Consent carries the requested mode while proposed and the effective
        approved mode and period after approval; it never widens or extends the service
        limits.
        POST is not idempotent. If the client cannot determine whether a request
        succeeded, it searches its own Consents by patient, service, and status
        before deciding whether to retry; a retry can create a second Consent.
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMConsentCreateRequest'
            examples:
              consentRequest:
                $ref: '#/components/examples/ConsentRequest'
      responses:
        '201':
          description: Created consent
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Content-Location:
              $ref: '#/components/headers/ContentLocation'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMConsent'
              examples:
                consentCreated:
                  $ref: '#/components/examples/ConsentRequestCreated'
          links:
            ReadConsentById:
              operationId: readConsent
              parameters:
                id: '$response.body#/id'
              description: Follow-up read of the created Consent.
        '400':
          $ref: '#/components/responses/OperationOutcomeConsentCreateBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Consent/_search:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    post:
      tags: [Consent]
      operationId: searchConsentsPost
      summary: Search consents using form parameters
      description: Equivalent to `GET /Consent` with the same supported parameters, authorization ceiling, result profile, and errors.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentSearchParameters'
            encoding:
              _include:
                style: form
                explode: true
              '_include:iterate':
                style: form
                explode: true
      responses:
        '200':
          description: Bundle of consents
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMConsentSearchBundle'
              examples:
                proposedByPatient:
                  $ref: '#/components/examples/ConsentProposedPatientSearchBundle'
                byService:
                  $ref: '#/components/examples/ConsentByServiceSearchBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Consent/{id}:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [Consent]
      operationId: readConsent
      summary: Read consent
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Consent resource
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMConsent'
              examples:
                consentApproved:
                  $ref: '#/components/examples/ConsentApproved'
                consentPatientNarrowed:
                  $ref: '#/components/examples/ConsentPatientNarrowed'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    head:
      tags: [Consent]
      operationId: headConsent
      summary: Check consent existence
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Consent exists.
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Consent not found.
    put:
      tags: [Consent]
      operationId: updateConsent
      summary: Deactivate owned consent
      description: |
        Service providers may deactivate a Consent request they created by setting
        `status=inactive`. PCM FHIR API does not expose patient approval, rejection,
        revocation, delegation, or assisted-consent flows; those are handled outside
        this API. Service providers may update only consents they created; deletion
        is not supported.
        The body `id` must equal the URL id. The closed request contains only
        `status=inactive`, fixed `scope=patient-privacy`, `category=INFA`, and legal
        `policy`, optional ordinary unknown extensions, and an optional request-profile
        declaration in `meta.profile`.
        Identity, patient, service, actor, period, access-mode, business-status, and
        every other Consent business element are prohibited; their presence rejects
        the whole request. Submitted `meta.versionId` and `meta.lastUpdated` are
        also prohibited.
        Accepted updates use last-write-wins after complete transition validation;
        `If-Match` and PATCH are not supported. The returned inactive Consent retains
        the same logical id and PCM business identifier.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMConsentDeactivateRequest'
            examples:
              providerDeactivate:
                $ref: '#/components/examples/ConsentUpdateProviderDeactivate'
      responses:
        '200':
          description: Updated consent
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMConsent'
              examples:
                consentUpdated:
                  $ref: '#/components/examples/ConsentServiceProviderCancelled'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        '409':
          $ref: '#/components/responses/OperationOutcomeConflict'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

components:
  securitySchemes:
    mtlsTransport:
      type: mutualTLS
      description: >
        mTLS is required on every PCM HTTP endpoint, including SMART discovery,
        CapabilityStatement metadata, and all FHIR interactions. The presented
        client certificate is not the OAuth2 client authentication method; OAuth2
        clients additionally authenticate with private_key_jwt at the token and
        introspection endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: OAuth2 bearer token (opaque) required for PCM FHIR API access.

  headers:
    Location:
      description: Absolute URL of the created FHIR resource.
      schema:
        type: string
        format: uri
    ContentLocation:
      description: Absolute URL of the returned current resource representation.
      schema:
        type: string
        format: uri
    LastModified:
      description: Last modification time of the returned authoritative resource.
      schema:
        type: string
        format: http-date

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    _id:
      name: _id
      in: query
      required: false
      schema:
        type: string
    _tag:
      name: _tag
      in: query
      required: false
      schema:
        type: string
      description: >
        FHIR token search on meta.tag. For HealthcareService use
        `http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|catalog` for catalog
        definitions and `http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|instance`
        for organization registrations/instances.
    identifier:
      name: identifier
      in: query
      required: false
      schema:
        type: string
      description: FHIR identifier search parameter.
    _lastUpdated:
      name: _lastUpdated
      in: query
      required: false
      schema:
        type: string
      description: Standard FHIR instant search parameter on server-managed `meta.lastUpdated`.
    thumbprint:
      name: thumbprint
      in: query
      required: false
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: AzYdwvaDPYEcNh9kZXLhKkjeo2_nO1Sx9FrqT9AxCXo
      description: |
        Token search on the nested thumbprint value in PCM's read-only
        `ext-applicable-certificates` inventory. A match identifies an
        authorized visible Endpoint whose PCM registry inventory contains the
        value; it does not register a certificate, prove current presentation,
        or declare access-token binding.
    active:
      name: active
      in: query
      required: false
      schema:
        type: string
      description: Search by activation status (token; true|false).
    service_category:
      name: service-category
      in: query
      required: false
      schema:
        type: string
      description: FHIR R4 search by HealthcareService.category.
    status:
      name: status
      in: query
      required: false
      schema:
        type: string
    type:
      name: type
      in: query
      required: false
      schema:
        type: string
      description: Search by Organization.type code.
    service_type:
      name: service-type
      in: query
      required: false
      schema:
        type: string
      description: FHIR R4 search by HealthcareService.type.
    name:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: Search by HealthcareService.name.
    organization:
      name: organization
      in: query
      required: false
      schema:
        type: string
      description: FHIR R4 search by HealthcareService.providedBy (instance profile only).
    based_on:
      name: based-on
      in: query
      required: false
      schema:
        type: string
      description: Search HealthcareService instance registrations by the canonical catalog HealthcareService referenced in the basedOn extension.
    partof:
      name: partof
      in: query
      required: false
      schema:
        type: string
    patient:
      name: patient
      in: query
      required: false
      schema:
        type: string
      description: Search by patient logical reference. Identifier search uses patient:identifier=system|value.
    patient_identifier:
      name: patient:identifier
      in: query
      required: false
      schema:
        type: string
      description: Search Consent.patient by logical identifier, formatted as system|value.
    pcm_service:
      name: pcm-service
      in: query
      required: false
      schema:
        type: string
      description: Search by pcmService extension reference (HealthcareService instance).
    pcm_business_status:
      name: pcm-business-status
      in: query
      required: false
      schema:
        type: string
      description: Search by the PCM-managed business-status extension for HealthcareService or Consent.
    Organization_include:
      name: _include
      in: query
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/OrganizationIncludeValues'
      description: >
        Include authorized Organization endpoints or parents using repeatable FHIR
        `_include` parameters. `_include` never widens access.
    Organization_include_iterate:
      name: _include:iterate
      in: query
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/OrganizationIncludeValues'
      description: >
        Recursively include authorized Organization endpoints or parents using
        repeatable FHIR `_include:iterate` parameters. Recursive inclusion never
        widens access.
    Consent_include:
      name: _include
      in: query
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/ConsentIncludeValues'
      description: >
        Include authorized Consent actors using repeatable FHIR `_include`
        parameters. `_include` never widens access.
    Consent_include_iterate:
      name: _include:iterate
      in: query
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/ConsentIterateIncludeValues'
      description: >
        Recursively include authorized Organization endpoints or parents using
        repeatable FHIR `_include:iterate` parameters. Recursive inclusion never
        widens access.

  responses:
    OperationOutcomeOrganizationCreateBadRequest:
      description: Invalid or unsupported Organization create request (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            unsupportedChild:
              $ref: '#/components/examples/OperationOutcomeOrganizationCreateUnsupportedChild'
    OperationOutcomeOrganizationCreateForbidden:
      description: Unauthorized Organization create request (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            wrongRole:
              $ref: '#/components/examples/OperationOutcomeOrganizationCreateWrongRole'
            crossParent:
              $ref: '#/components/examples/OperationOutcomeOrganizationCreateCrossParent'
    OperationOutcomeConsentCreateBadRequest:
      description: Invalid Consent create request (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            badRequest:
              $ref: '#/components/examples/OperationOutcomeBadRequest'
    OperationOutcomeBadRequest:
      description: Bad request (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            badRequest:
              $ref: '#/components/examples/OperationOutcomeBadRequest'
            validationFailure:
              $ref: '#/components/examples/OperationOutcomeValidationFailure'
            invalidBasedOn:
              $ref: '#/components/examples/OperationOutcomeInvalidBasedOn'
    OperationOutcomeUnauthorized:
      description: Unauthorized (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            unauthorized:
              $ref: '#/components/examples/OperationOutcomeUnauthorized'
    OperationOutcomeForbidden:
      description: Forbidden (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            forbidden:
              $ref: '#/components/examples/OperationOutcomeForbidden'
            authorizationFailure:
              $ref: '#/components/examples/OperationOutcomeAuthorizationFailure'
    OperationOutcomeUnprocessable:
      description: Unprocessable request (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            materialChange:
              $ref: '#/components/examples/OperationOutcomeMaterialCanonicalChange'
            unsupportedChange:
              $ref: '#/components/examples/OperationOutcomeCanonicalUpdateViaPut'
    OperationOutcomeConflict:
      description: Current-state transition or resource conflict (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    OperationOutcomeServiceConflict:
      description: Service registration conflict (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            duplicateRegistration:
              $ref: '#/components/examples/OperationOutcomeDuplicateServiceRegistration'
            duplicateName:
              $ref: '#/components/examples/OperationOutcomeDuplicateServiceName'
            stateConflict:
              $ref: '#/components/examples/OperationOutcomeStateConflict'
    OperationOutcomeNotFound:
      description: Not found (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            notFound:
              $ref: '#/components/examples/OperationOutcomeNotFound'
    OperationOutcomeError:
      description: Server error (OperationOutcome)
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          examples:
            internalError:
              $ref: '#/components/examples/OperationOutcomeInternalError'

  schemas:
    BaseResource:
      type: object
      required: [resourceType]
      additionalProperties: true
      properties:
        resourceType:
          type: string
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'

    DomainResource:
      allOf:
        - $ref: '#/components/schemas/BaseResource'
        - type: object
          additionalProperties: true
          properties:
            extension:
              type: array
              items:
                $ref: '#/components/schemas/Extension'

    Resource:
      type: object
      required: [resourceType]
      additionalProperties: true
      properties:
        resourceType:
          type: string

    CapabilityStatement:
      allOf:
        - $ref: '#/components/schemas/DomainResource'
        - type: object
          required: [resourceType]
          properties:
            resourceType:
              type: string
              enum: [CapabilityStatement]
            url:
              type: string
            name:
              type: string
            title:
              type: string
            status:
              type: string
            experimental:
              type: boolean
            date:
              type: string
            publisher:
              type: string
            description:
              type: string
            kind:
              type: string
            fhirVersion:
              type: string
            format:
              type: array
              items:
                type: string
            software:
              $ref: '#/components/schemas/CapabilityStatementSoftware'
            implementation:
              $ref: '#/components/schemas/CapabilityStatementImplementation'
            rest:
              type: array
              items:
                $ref: '#/components/schemas/CapabilityStatementRest'

    CapabilityStatementSoftware:
      type: object
      properties:
        name:
          type: string
        version:
          type: string

    CapabilityStatementImplementation:
      type: object
      properties:
        description:
          type: string
        url:
          type: string

    CapabilityStatementRest:
      type: object
      properties:
        mode:
          type: string
        documentation:
          type: string
        security:
          $ref: '#/components/schemas/CapabilityStatementRestSecurity'
        resource:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityStatementRestResource'

    CapabilityStatementRestSecurity:
      type: object
      properties:
        description:
          type: string

    CapabilityStatementRestResource:
      type: object
      properties:
        type:
          type: string
        profile:
          type: string
        supportedProfile:
          type: array
          items:
            type: string
        documentation:
          type: string
        updateCreate:
          type: boolean
        interaction:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityStatementRestResourceInteraction'
        operation:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityStatementRestResourceOperation'
        searchParam:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityStatementRestResourceSearchParam'
        searchInclude:
          type: array
          items:
            type: string

    CapabilityStatementRestResourceInteraction:
      type: object
      properties:
        code:
          type: string

    CapabilityStatementRestResourceOperation:
      type: object
      properties:
        name:
          type: string
        definition:
          type: string
        documentation:
          type: string

    CapabilityStatementRestResourceSearchParam:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        definition:
          type: string
        documentation:
          type: string

    SmartConfiguration:
      type: object
      description: |
        SMART configuration for the current environment. Clients must tolerate
        additional metadata properties and additional advertised algorithm
        values. `registration_endpoint` is omitted until PCM enables a
        supported dynamic-registration interaction. PCM does not enumerate
        standard SMART v2 scopes in `scopes_supported` and advertises no custom
        non-FHIR scopes.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - introspection_endpoint
        - grant_types_supported
        - response_types_supported
        - response_modes_supported
        - token_endpoint_auth_methods_supported
        - token_endpoint_auth_signing_alg_values_supported
        - introspection_endpoint_auth_methods_supported
        - introspection_endpoint_auth_signing_alg_values_supported
        - tls_client_certificate_bound_access_tokens
        - code_challenge_methods_supported
        - capabilities
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        introspection_endpoint:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
          description: Optional OAuth 2.0 dynamic client-registration endpoint. Omitted until the capability is enabled.
        grant_types_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
