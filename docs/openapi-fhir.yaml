                required: [type]
                properties:
                  type:
                    type: array
                    contains:
                      type: object
                      additionalProperties: true
                      required: [coding]
                      properties:
                        coding:
                          type: array
                          contains:
                            type: object
                            additionalProperties: true
                            required: [system, code]
                            properties:
                              system:
