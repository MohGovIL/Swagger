    PCMOrganizationParent:
      description: |
        Authoritative Parent Organization. Logical id, all identifiers, type,
        name, address, telecom, and active state are PCM-managed. Contacts are
        organization-writable and inherit no mandatory structural slices. The
        structurally distinguishable MoH type/identifier mappings are published
        here and enforced by PCM; PCM validates ambiguous and unresolved
        categories during onboarding.
      x-pcm-moh-identifier-mapping:
        description: Machine-readable onboarding mapping for structurally distinguishable Parent types; PCM manually validates ambiguous or unresolved categories.
        rules:
          - institutionTypeCodes: ["73"]
            requiredIdentifier:
              system: http://fhir.health.gov.il/cs/paying-entity-moh
              allowedValues: ["101", "102", "103", "104"]
            prohibitedIdentifierSystem: http://institutions.health.gov.il/Institutions
          - institutionTypeCodes: ["1", "22"]
            requiredIdentifier:
              system: http://institutions.health.gov.il/Institutions
            prohibitedIdentifierSystem: http://fhir.health.gov.il/cs/paying-entity-moh
          - institutionTypeCodes: ["71"]
            requiredIdentifier:
              system: http://fhir.health.gov.il/cs/paying-entity-moh
              allowedValues: ["406"]
          - institutionTypeCodes: ["75"]
            requiredIdentifier:
              system: http://fhir.health.gov.il/cs/paying-entity-moh
              allowedValues: ["401"]
          - institutionTypeCodes: ["87"]
            requiredIdentifier:
              system: http://fhir.health.gov.il/cs/paying-entity-moh
              allowedValues: ["405"]
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [resourceType, id, meta, identifier, active, type, name]
          properties:
            resourceType:
              type: string
              const: Organization
            id:
              type: string
              readOnly: true
            meta:
              allOf:
                - $ref: '#/components/schemas/PCMResponseMeta'
                - type: object
                  properties:
                    profile:
                      contains:
                        const: http://pcm.fhir.health.gov.il/StructureDefinition/pcm-organization-parent
                      minContains: 1
                      maxContains: 1
            identifier:
              type: array
              minItems: 1
              allOf:
                - contains:
                    type: object
                    additionalProperties: true
                    required: [system]
                    properties:
                      system:
                        const: http://institutions.health.gov.il/Institutions
                  minContains: 0
                  maxContains: 1
                - contains:
                    type: object
                    additionalProperties: true
                    required: [system]
                    properties:
                      system:
                        const: http://fhir.health.gov.il/cs/paying-entity-moh
                  minContains: 0
                  maxContains: 1
              contains:
                $ref: '#/components/schemas/PCMOrganizationIdentifier'
              minContains: 1
              maxContains: 1
              items:
                $ref: '#/components/schemas/PCMParentOrganizationIdentifier'
            active:
              type: boolean
            type:
              type: array
              minItems: 2
              contains:
                $ref: '#/components/schemas/PCMParentOrganizationType'
              minContains: 1
              maxContains: 1
              items:
                $ref: '#/components/schemas/CodeableConcept'
            name:
              type: string
            contact:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/OrganizationContact'
                  - type: object
                    required: [purpose]
            alias: false
            partOf: false
            endpoint: false
          allOf:
            - if:
                type: object
                additionalProperties: true
                required: [active]
                properties:
                  active:
                    const: true
              then:
                type: object
                additionalProperties: true
                required: [identifier]
                properties:
                  identifier:
                    type: array
                    contains:
                      $ref: '#/components/schemas/PCMApplicableMohOrganizationIdentifier'
                    minContains: 1
                    maxContains: 1
            - if:
                type: object
                additionalProperties: true
                required: [type]
                properties:
                  type:
                    type: array
                    contains:
                      type: object
                      additionalProperties: true
                      required: [coding]
                      properties:
                        coding:
                          type: array
                          contains:
                            type: object
                            additionalProperties: true
                            required: [system, code]
                            properties:
                              system:
                                const: http://fhir.health.gov.il/cs/institution-type-moh
                              code:
                                const: "73"
              then:
                type: object
                additionalProperties: true
                required: [identifier]
                properties:
                  identifier:
                    type: array
                    contains:
                      type: object
                      additionalProperties: true
                      required: [system, value]
                      properties:
                        system:
                          const: http://fhir.health.gov.il/cs/paying-entity-moh
                        value:
                          enum: ["101", "102", "103", "104"]
                    minContains: 1
                    maxContains: 1
                    not:
                      contains:
                        type: object
                        additionalProperties: true
                        required: [system]
                        properties:
                          system:
                            const: http://institutions.health.gov.il/Institutions
            - if:
                type: object
                additionalProperties: true
                required: [identifier]
                properties:
                  identifier:
                    type: array
                    contains:
                      type: object
                      additionalProperties: true
                      required: [system, value]
                      properties:
                        system:
                          const: http://fhir.health.gov.il/cs/paying-entity-moh
                        value:
                          enum: ["101", "102", "103", "104"]
              then:
                type: object
                additionalProperties: true
                required: [type]
                properties:
                  type:
                    type: array
                    contains:
                      $ref: '#/components/schemas/PCMParentMohType73'
            - if:
                type: object
                additionalProperties: true
                required: [type]
                properties:
                  type:
                    type: array
                    contains:
                      type: object
                      additionalProperties: true
                      required: [coding]
                      properties:
                        coding:
                          type: array
                          contains:
                            type: object
                            additionalProperties: true
                            required: [system, code]
                            properties:
                              system:
                                const: http://fhir.health.gov.il/cs/institution-type-moh
                              code:
                                enum: ["1", "22"]
              then:
                type: object
                additionalProperties: true
                required: [identifier]
                properties:
                  identifier:
                    type: array
                    contains:
                      $ref: '#/components/schemas/PCMMohInstitutionIdentifier'
                    minContains: 1
                    maxContains: 1
                    not:
                      contains:
                        type: object
                        additionalProperties: true
                        required: [system]
                        properties:
                          system:
                            const: http://fhir.health.gov.il/cs/paying-entity-moh
            - if:
