openapi: 3.1.0
info:
  title: PCM FHIR API
  version: "0.3.2"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    OpenAPI definition for the PCM FHIR server. This covers the external FHIR REST API
    interactions for organization onboarding updates, service registration,
    consent creation/retrieval, and endpoint registration. Continuing service
    review is not exposed as a queryable FHIR
    workflow. Client-visible service lifecycle is reflected by HealthcareService
    extension[businessStatus],
    HealthcareService.active, and OperationOutcome responses.
    Retrieval/response examples show complete profiled FHIR resources; submit
    examples show the smaller server-accepted request bodies where those differ
    from full response resources.
    The production PCM FHIR base is `https://pcm2m.health.gov.il/r4`;
    non-production deployments use their assigned environment base. Participant
    hosts under `example.org` are placeholders. Exact-match requirements apply
    to the applicable runtime values. Canonical FHIR URLs,
    code-system/value-set URLs, identifier-system URIs, and other named protocol
    URIs remain the published identifiers.
    Unless otherwise noted, FHIR REST requests/responses use application/fhir+json.
    Every PCM HTTP endpoint requires transport-level mTLS, including SMART
    discovery and CapabilityStatement metadata. FHIR resource operations
    additionally require OAuth2 bearer access tokens. OAuth2 client authentication for token issuance/introspection
    is `private_key_jwt` using `ES256`; mTLS is not advertised as `tls_client_auth`. Profile-specific
    constraints are defined by the PCM FHIR profiles and illustrated by the examples.
    Authorization is a hard ceiling on search results: every primary match must both
    satisfy the supplied search criteria and be authorized for the caller to read.
    Search filters can only narrow the authorized primary-result set. `_include` and
    `_include:iterate` can add only related resources that the caller is authorized
    to read under the same resource-visibility rules; they never widen access.
    Returned profiles describe complete authoritative resources. Every public FHIR
    POST/PUT uses a closed interaction-specific request schema. A prohibited element,
    authorization failure, or invalid transition rejects the whole request atomically;
    PCM does not silently ignore business content. FHIR create identity is the
    narrow exception: POST ignores a submitted `id` and assigns the authoritative
    logical id; PUT requires the body `id` to match the URL. Submitted
    `meta.versionId` and `meta.lastUpdated` are prohibited in every direct
    create/update request and in the outer `$request-catalog-update` Parameters
    metadata. The embedded complete `proposedCatalog` may retain both optional
    values copied from the retrieved canonical; PCM removes them before semantic
    comparison, and neither provides optimistic concurrency.
    Unsupported modifier extensions
    are rejected. Unknown ordinary non-modifier extensions are accepted without PCM
    interpretation or a round-trip guarantee. Every failure handled by the FHIR API
    returns an appropriate HTTP error and OperationOutcome; TLS, OAuth, and bodyless
    HEAD failures retain their protocol-native handling.
servers:
  - url: https://pcm2m.health.gov.il/r4
    description: Production PCM FHIR base URL; use the assigned base for a non-production environment. Every endpoint requires mTLS.

tags:
  - name: Organization
    description: Parent, service-provider, and data-source organizations.
  - name: Endpoint
    description: FHIR server endpoints for data sources.
  - name: HealthcareService
    description: Canonical catalog services and provider service registrations.
  - name: Consent
    description: Consent request creation, owned consent read/search, and owned consent deactivation. Deletion is not supported.
  - name: CapabilityStatement
    description: Server metadata and supported interactions.
  - name: SMART
    description: SMART on FHIR OAuth2 configuration.

security:
  - mtlsTransport: []
    bearerAuth: []

paths:
  /.well-known/smart-configuration:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [SMART]
      operationId: getSmartConfiguration
      summary: Read SMART on FHIR configuration
      description: |
        OAuth2/SMART discovery document for the PCM authorization server.
        Retrieval of this discovery document requires mTLS. PCM supports standard
        SMART App Launch v2 patient-level resource-scope syntax, including
        query-constrained scopes with search modifiers, chaining, and reverse
        chaining. `user/...` app-launch scopes and `_filter` scope constraints are
        not supported. PCM does not enumerate standard SMART scopes through
        `scopes_supported` and advertises no custom non-FHIR scopes.
      security:
        - mtlsTransport: []
      responses:
        '200':
          description: SMART configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartConfiguration'
              examples:
                pcmSmartConfiguration:
                  $ref: '#/components/examples/SmartConfigurationPCM'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
  /metadata:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [CapabilityStatement]
      operationId: readCapabilityStatement
      summary: Read capability statement
      description: |
        Returns the PCM server CapabilityStatement describing supported resources,
        interactions, and search parameters. Retrieval requires mTLS.
      security:
        - mtlsTransport: []
      responses:
        '200':
          description: CapabilityStatement
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/CapabilityStatement'
              examples:
                pcmCapabilityStatement:
                  $ref: '#/components/examples/CapabilityStatementPCM'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
  /Organization:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [Organization]
      operationId: searchOrganizations
      summary: Search organizations
      description: |
        Search organizations by supported parameters. Used for discovery and retrieval,
        including searches by active flag or identifier.
      parameters:
        - $ref: '#/components/parameters/_id'
        - $ref: '#/components/parameters/identifier'
        - $ref: '#/components/parameters/active'
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/partof'
        - $ref: '#/components/parameters/_lastUpdated'
        - $ref: '#/components/parameters/Organization_include'
        - $ref: '#/components/parameters/Organization_include_iterate'
      responses:
        '200':
          description: Bundle of matching organizations
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMOrganizationSearchBundle'
              examples:
                sourceOrganizationsWithParents:
                  $ref: '#/components/examples/OrganizationSourceSearchWithParentBundle'
                serviceProvidersByParent:
                  $ref: '#/components/examples/OrganizationServiceProviderByParentSearchBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    post:
      tags: [Organization]
      operationId: createServiceProviderOrganization
      summary: Create Service Provider child organization
      description: |
        After PCM separately authorizes Service Provider expansion, creates one
        Service Provider child under the authenticated organization's Parent. PCM
        derives and validates the Parent and role, assigns the logical and PCM
        business identifiers and authoritative name, and returns the child. PCM
        manages the optional read-only redirect projection from its OAuth client
        registration; a supplied redirect URI or other prohibited field rejects the
        complete request. The interaction does not
        allocate an OAuth client or register a certificate. Parent and Data Source
        child creation are not supported.
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMOrganizationServiceProviderCreateRequest'
            examples:
              serviceProviderCreate:
                $ref: '#/components/examples/OrganizationServiceProviderCreate'
      responses:
        '201':
          description: Created Service Provider child
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Content-Location:
              $ref: '#/components/headers/ContentLocation'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMOrganizationServiceProvider'
              examples:
                serviceProviderOrganization:
                  $ref: '#/components/examples/OrganizationServiceProviderRetrieval'
        '400':
          $ref: '#/components/responses/OperationOutcomeOrganizationCreateBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeOrganizationCreateForbidden'
        '409':
          $ref: '#/components/responses/OperationOutcomeConflict'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Organization/_search:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    post:
      tags: [Organization]
      operationId: searchOrganizationsPost
      summary: Search organizations using form parameters
      description: Equivalent to `GET /Organization` with the same supported parameters, authorization ceiling, result profile, and errors.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationSearchParameters'
            encoding:
              _include:
                style: form
                explode: true
              '_include:iterate':
                style: form
                explode: true
      responses:
        '200':
          description: Bundle of matching organizations
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMOrganizationSearchBundle'
              examples:
                sourceOrganizationsWithParents:
                  $ref: '#/components/examples/OrganizationSourceSearchWithParentBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Organization/{id}:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [Organization]
      operationId: readOrganization
      summary: Read organization
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Organization resource
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMOrganization'
              examples:
                parentOrganization:
                  $ref: '#/components/examples/OrganizationParentRetrieval'
                serviceProviderOrganization:
                  $ref: '#/components/examples/OrganizationServiceProviderRetrieval'
                longDurationServiceProvider:
                  $ref: '#/components/examples/OrganizationServiceProviderLongDuration'
                dataSourceOrganization:
                  $ref: '#/components/examples/OrganizationDataSourceRetrieval'
                pcmSystemOrganization:
                  $ref: '#/components/examples/OrganizationPcmSystem'
                equalLogicalAndBusinessId:
                  $ref: '#/components/examples/OrganizationEqualLogicalBusinessId'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    head:
      tags: [Organization]
      operationId: headOrganization
      summary: Check organization existence
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Organization exists.
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Organization not found.
    put:
      tags: [Organization]
      operationId: updateOrganization
      summary: Update organization
      description: |
        Used by organizations to update allowed fields depending on Organization type.
        Parent Organization updates are limited to contact details. Service Provider
        children may update contact overrides. Data Source children may update contact
        overrides and their own validated Endpoint linkage. MoH/PCM exclusively
        controls Parent and child Organization.active. Parent inactivity gates child
        use without rewriting the child active values.
        The body `id` must equal the URL id. The complete client-writable
        projection is replaced: omitted optional writable fields are removed and
        repeating fields replace the stored collection. Every other business element,
        including identifier, active, role, Parent linkage, OAuth redirect projection,
        and applicable-certificate inventory, is prohibited. Its presence rejects the
        whole update. Submitted `meta.versionId` and `meta.lastUpdated` are
        prohibited. Accepted updates use last-write-wins
        only after complete validation; `If-Match` and PATCH are not supported.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMOrganizationUpdateRequest'
            examples:
              parentOrganizationUpdate:
                $ref: '#/components/examples/OrganizationParentSubmit'
              serviceProviderUpdate:
                $ref: '#/components/examples/OrganizationServiceProviderSubmit'
              dataSourceUpdate:
                $ref: '#/components/examples/OrganizationDataSourceSubmit'
      responses:
        '200':
          description: Updated organization
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMOrganization'
              examples:
                parentOrganization:
                  $ref: '#/components/examples/OrganizationParentRetrieval'
                serviceProviderOrganization:
                  $ref: '#/components/examples/OrganizationServiceProviderRetrieval'
                dataSourceOrganization:
                  $ref: '#/components/examples/OrganizationDataSourceRetrieval'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        '409':
          $ref: '#/components/responses/OperationOutcomeConflict'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Endpoint:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [Endpoint]
      operationId: searchEndpoints
      summary: Search endpoints
      parameters:
        - $ref: '#/components/parameters/_id'
        - $ref: '#/components/parameters/_lastUpdated'
        - $ref: '#/components/parameters/thumbprint'
      responses:
        '200':
          description: Bundle of endpoints
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMEndpointSearchBundle'
              examples:
                endpointSearch:
                  $ref: '#/components/examples/EndpointSearchBundle'
                thumbprintInventorySearch:
                  $ref: '#/components/examples/EndpointThumbprintSearchBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    post:
      tags: [Endpoint]
      operationId: createEndpoint
      summary: Create endpoint
      description: |
        Creates an Endpoint owned by the authenticated Data Source. The request
        supplies an exact HTTPS FHIR base address and initial status `active` or
        `suspended`; creation as `off` is invalid. `connectionType` and `payloadType`
        are fixed request-envelope values. PCM derives `managingOrganization`.
        Identity, ownership, and certificate-inventory input is prohibited.
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMEndpointCreateRequest'
            examples:
              endpointSubmit:
                $ref: '#/components/examples/EndpointSubmit'
      responses:
        '201':
          description: Created endpoint
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Content-Location:
              $ref: '#/components/headers/ContentLocation'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMEndpoint'
              examples:
                endpointCreated:
                  $ref: '#/components/examples/EndpointRetrieval'
          links:
            ReadEndpointById:
              operationId: readEndpoint
              parameters:
                id: '$response.body#/id'
              description: Follow-up read of the created Endpoint.
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '409':
          $ref: '#/components/responses/OperationOutcomeConflict'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Endpoint/_search:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    post:
      tags: [Endpoint]
      operationId: searchEndpointsPost
      summary: Search endpoints using form parameters
      description: Equivalent to `GET /Endpoint` with the same supported parameters, authorization ceiling, result profile, and errors.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EndpointSearchParameters'
            examples:
              thumbprintInventoryLookup:
                summary: Look up visible Endpoint inventory by associated-certificate thumbprint
                description: |
                  This filter reads PCM's associated-certificate inventory. It does
                  not register or authorize a certificate, describe the complete
                  trust store, prove current certificate presentation, declare token
                  binding, or widen the caller's authorized Endpoint result set.
                value:
                  thumbprint: AzYdwvaDPYEcNh9kZXLhKkjeo2_nO1Sx9FrqT9AxCXo
      responses:
        '200':
          description: Bundle of endpoints
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMEndpointSearchBundle'
              examples:
                endpointSearch:
                  $ref: '#/components/examples/EndpointSearchBundle'
                thumbprintInventorySearch:
                  $ref: '#/components/examples/EndpointThumbprintSearchBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /Endpoint/{id}:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [Endpoint]
      operationId: readEndpoint
      summary: Read endpoint
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Endpoint resource
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMEndpoint'
              examples:
                endpointRetrieval:
                  $ref: '#/components/examples/EndpointRetrieval'
                endpointPcmSystem:
                  $ref: '#/components/examples/EndpointPcmSystem'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    head:
      tags: [Endpoint]
      operationId: headEndpoint
      summary: Check endpoint existence
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Endpoint exists.
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Endpoint not found.
    put:
      tags: [Endpoint]
      operationId: updateEndpoint
      summary: Update endpoint
      description: |
        Replaces the complete Data Source-writable Endpoint projection. The body
        `id` must equal the URL id. The owner controls status through `active`,
        `suspended`, and terminal `off`: active and suspended are reversible,
        active/suspended may become off, off cannot be restored, and same-state
        requests are idempotent. An address change is accepted only while the
        current Endpoint is suspended and immediately invalidates the old audience.
        A referenced Endpoint cannot be turned off; create and validate a replacement,
        link it from the Data Source Organization, then retire the old Endpoint.
        PCM derives ownership. `managingOrganization`, identity, certificate inventory,
        and every other prohibited element reject the whole request. Submitted
        `meta.versionId` and `meta.lastUpdated` are prohibited. Only the currently
        referenced active Endpoint is eligible for source-token issuance and active
        introspection. Suspension/off does not mutate Consent or waive reporting, and
        PCM management access remains available for resume/replacement. `If-Match`
        and PATCH are not supported.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMEndpointUpdateRequest'
            examples:
              endpointAddressUpdateWhileSuspended:
                $ref: '#/components/examples/EndpointUpdate'
              endpointRetireAfterReplacement:
                $ref: '#/components/examples/EndpointOldOff'
      responses:
        '200':
          description: Updated endpoint
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMEndpoint'
              examples:
                endpointUpdated:
                  $ref: '#/components/examples/EndpointRetrieval'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '404':
          $ref: '#/components/responses/OperationOutcomeNotFound'
        '409':
          $ref: '#/components/responses/OperationOutcomeConflict'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

  /HealthcareService:
    servers:
      - url: https://pcm2m.health.gov.il/r4
    get:
      tags: [HealthcareService]
      operationId: searchHealthcareServices
      summary: Search services
      description: |
        Search canonical catalog services and provider service registrations.
        Use `_tag=http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|catalog` to search
        catalog definitions only, and `_tag=http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|instance`
        to search organization registration/instance records only. Instance registry
        searches can also use `organization` to find registrations owned by a Service
        Provider, and `based-on` to find all registrations tied to a canonical catalog
        service.

        Identifier searches can target either PCM HealthcareService identifier system:
        `http://pcm.fhir.health.gov.il/identifier/pcm-healthcareservice-catalog-id`
        for canonical catalog entries, or
        `http://pcm.fhir.health.gov.il/identifier/pcm-healthcareservice-instance-id`
        for provider service registrations.

        Catalog search is a client catalog-discovery surface. For
        `_tag=http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|catalog`, PCM returns only
        active/registrable catalog services; passing `active=true` is redundant, and
        `active=false` is not a supported way to discover pending, frozen, rejected, or
        cancelled catalog records.

        Instance search is the client registry surface. For
        `_tag=http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|instance`, omitting `active`
        returns instance registrations visible to the caller, including active instances
        and pending instances published for objection. `active=true` narrows to externally
        usable instances. `active=false` returns visible inactive instances according to
        the client visibility rules: pending registrations are visible for objection
        handling; rejected/frozen/suspended registrations are visible only to the
        owning Service Provider HO. Cancelled registrations remain owner-visible for
        audit and idempotent retries but are excluded from ordinary discovery.
      parameters:
        - $ref: '#/components/parameters/_id'
        - $ref: '#/components/parameters/identifier'
        - $ref: '#/components/parameters/active'
        - $ref: '#/components/parameters/service_category'
        - $ref: '#/components/parameters/service_type'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/_tag'
        - $ref: '#/components/parameters/based_on'
        - $ref: '#/components/parameters/pcm_business_status'
        - $ref: '#/components/parameters/_lastUpdated'
      responses:
        '200':
          description: Bundle of services
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMHealthcareServiceSearchBundle'
              examples:
                activeCatalogDiscovery:
                  $ref: '#/components/examples/HealthcareServiceActiveCatalogSearchBundle'
                instanceRegistry:
                  $ref: '#/components/examples/HealthcareServiceInstanceRegistrySearchBundle'
                pendingRegistrations:
                  $ref: '#/components/examples/HealthcareServicePendingRegistrationSearchBundle'
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        default:
          $ref: '#/components/responses/OperationOutcomeError'
    post:
      tags: [HealthcareService]
      operationId: createHealthcareService
      summary: Register service or request a new service
      description: |
        Service providers discover active catalog services first with
        `GET /HealthcareService?_tag=http://pcm.fhir.health.gov.il/cs/pcm-meta-tag|catalog&active=true`.
        If a suitable active canonical catalog service exists, the provider posts a
        minimal instance HealthcareService with the `basedOn` extension to register
        for that service. If no suitable service exists, the provider posts a full
        new-service registration request through the same instance flow, including
        service name, purpose, information buckets, history depth, access mode,
        access duration, clinical information, and example queries.

        The calling Service Provider child Organization must be operationally active:
        child and Parent are active and all documented policy preconditions permit use.

        Submit profiles are interaction-specific server validation profiles; their
        canonicals are not required in request `meta.profile`. Direct create requests
        must omit `meta.tag`. PCM adds the authoritative HealthcareService
        classification tag to each returned resource: `catalog` for a catalog
        definition and `instance` for a provider registration. A client-supplied
        `meta.tag` is a prohibited field and is rejected with `400 Bad Request` and
        the ordinary validation OperationOutcome.

        `basedOn` present means an existing catalog registration; no `basedOn` with
        a full service definition means a new-service registration request.
        Created/read response examples use the returned
        `pcm-healthcareservice-instance` profile.

        External clients do not directly create canonical catalog services. The
        request shape, including whether `basedOn` is present, selects the create
        path; clients do not select it with a tag.
        For a valid new-service registration request, PCM creates
        both the canonical catalog service and the provider's organization
        registration with `businessStatus=pending` and `active=false`. Activation and
        any required review or exception handling are managed outside this FHIR
        operation. Clients observe the result through extension[businessStatus],
        `HealthcareService.active`, and OperationOutcome responses, not through
        separate public review resources.

        Full service definitions require a human-readable service purpose. The public
        FHIR representation for that purpose is `HealthcareService.extraDetails`, carrying
        the service description/purpose ("תיאור השירות (מטרה)"). Client-supplied `active`,
        `businessStatus`, identifiers, ownership, or other fields outside the selected
        closed submit schema reject the whole request. PCM assigns
        the stable provider-registration business identifier using system
        `http://pcm.fhir.health.gov.il/identifier/pcm-healthcareservice-instance-id`; clients
        must omit `identifier` and `meta.tag`. The interaction profile canonical is
        not required in request `meta.profile`. The separate
        `$request-catalog-update` operation carries a complete proposed catalog
        resource, so that proposal retains its fixed `catalog` classification tag.
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/PCMHealthcareServiceCreateRequest'
            examples:
              existingCatalogInstanceSubmit:
                $ref: '#/components/examples/HealthcareServiceInstanceSubmit'
              newServiceRegistrationSubmit:
                $ref: '#/components/examples/HealthcareServiceNewServiceRegistrationSubmit'
      responses:
        '201':
          description: Created service
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Content-Location:
              $ref: '#/components/headers/ContentLocation'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PCMHealthcareServiceInstance'
              examples:
                instanceCreated:
                  $ref: '#/components/examples/HealthcareServiceInstanceRetrieval'
                pendingNewServiceCreated:
                  $ref: '#/components/examples/HealthcareServiceInstancePendingRetrieval'
          links:
            ReadHealthcareServiceById:
              operationId: readHealthcareService
              parameters:
                id: '$response.body#/id'
              description: Follow-up read of the created HealthcareService.
        '400':
          $ref: '#/components/responses/OperationOutcomeBadRequest'
        '401':
          $ref: '#/components/responses/OperationOutcomeUnauthorized'
        '403':
          $ref: '#/components/responses/OperationOutcomeForbidden'
        '409':
          $ref: '#/components/responses/OperationOutcomeServiceConflict'
        '422':
          $ref: '#/components/responses/OperationOutcomeUnprocessable'
        default:
          $ref: '#/components/responses/OperationOutcomeError'

