    PCMLogicalPatientReference:
      allOf:
        - $ref: '#/components/schemas/Reference'
        - type: object
          required: [identifier]
          not:
            required: [reference]
            properties:
              reference: {}
          properties:
            identifier:
              description: |
                Identifier-system membership and the Israeli ID checksum are also
                validated by the PCM Consent profile. Passport-system URIs must be
                members of `http://fhir.health.gov.il/ValueSet/passport-uri`.
              oneOf:
                - type: object
                  required: [system, value]
                  properties:
                    use:
                      type: string
                    system:
                      type: string
                      const: http://fhir.health.gov.il/identifier/il-national-id
                    value:
                      type: string
                      pattern: '^[0-9]{9}$'
                      description: Must also pass the Israeli ID check-digit algorithm.
                - type: object
                  required: [system, value]
                  properties:
                    use:
                      type: string
                    system:
                      type: string
                      const: http://fhir.health.gov.il/identifier/il-hdp-test-id
                    value:
                      type: string
                      enum: ["1", "2"]
                - type: object
                  required: [system, value]
                  properties:
                    use:
                      type: string
                    system:
                      type: string
                      format: uri
                      not:
                        enum:
                          - http://fhir.health.gov.il/identifier/il-national-id
                          - http://fhir.health.gov.il/identifier/il-hdp-test-id
                      description: Must be a member of the IL passport-uri ValueSet.
                    value:
                      type: string
                      pattern: '^\S(?:.*\S)?$'

