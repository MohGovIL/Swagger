    PCMInformationBucketExtension:
      description: |
        One PCM information-bucket rule. Across a single HealthcareService, the
        IL HDP bucket code inside each such extension must be unique. PCM rejects
        the complete create, update proposal, or authoritative resource when a
        bucket code is repeated.
      x-pcm-parent-collection-unique-by: extension[url=bucket].valueCodeableConcept.coding[system=http://fhir.health.gov.il/cs/il-hdp-information-buckets].code
      allOf:
        - $ref: '#/components/schemas/Extension'
        - type: object
          required: [url, extension]
          properties:
            url:
              type: string
              const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-information-bucket
            valueString: false
            valueUrl: false
            valueCode: false
            valueBoolean: false
            valueReference: false
            valueCoding: false
            valueCodeableConcept: false
            valueDuration: false
            valuePeriod: false
            extension:
              type: array
              minItems: 2
              maxItems: 3
              allOf:
                - contains:
                    $ref: '#/components/schemas/PCMInformationBucketPart'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMInformationHistoryDepthPart'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMInformationTaggedDetailsPart'
                  minContains: 0
                  maxContains: 1
              items:
                oneOf:
                  - $ref: '#/components/schemas/PCMInformationBucketPart'
                  - $ref: '#/components/schemas/PCMInformationHistoryDepthPart'
                  - $ref: '#/components/schemas/PCMInformationTaggedDetailsPart'

    PCMHealthcareServiceExtension:
      allOf:
        - $ref: '#/components/schemas/Extension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-service-business-status
          then:
            $ref: '#/components/schemas/PCMServiceBusinessStatusExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-based-on-canonical-healthcareservice
          then:
            $ref: '#/components/schemas/PCMBasedOnHealthcareServiceExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-mode
          then:
            $ref: '#/components/schemas/PCMAccessModeExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-duration
          then:
            $ref: '#/components/schemas/PCMAccessDurationExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-example-query
          then:
            $ref: '#/components/schemas/PCMExampleQueryExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-allow-patient-bucket-change
          then:
            $ref: '#/components/schemas/PCMAllowPatientBucketChangeExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-approval-window
          then:
            $ref: '#/components/schemas/PCMApprovalWindowExtension'
        - if:
            required: [url]
            properties:
              url:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-information-bucket
          then:
            $ref: '#/components/schemas/PCMInformationBucketExtension'

    PCMHealthcareServiceBaseResponse:
      allOf:
        - $ref: '#/components/schemas/HealthcareService'
        - type: object
          required: [resourceType, id, meta, identifier, active, name, category, type, extraDetails, extension]
          properties:
            comment: false
            specialty: false
            location: false
            telecom: false
            coverageArea: false
            serviceProvisionCode: false
            eligibility: false
            program: false
            characteristic: false
            communication: false
            referralMethod: false
            appointmentRequired: false
            availableTime: false
            notAvailable: false
            availabilityExceptions: false
            endpoint: false
            photo: false
            resourceType:
              type: string
              const: HealthcareService
            id:
              type: string
            meta:
              $ref: '#/components/schemas/Meta'
            identifier:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/Identifier'
            active:
              type: boolean
            name:
              type: string
              minLength: 1
            category:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/CodeableConcept'
            type:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMHealthcareServiceInformationAccessType'
            extraDetails:
              type: string
              minLength: 1
            extension:
              type: array
              minItems: 6
              allOf:
                - contains:
                    $ref: '#/components/schemas/PCMServiceBusinessStatusExtension'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMAccessModeExtension'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMAccessDurationExtension'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMExampleQueryExtension'
                  minContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMAllowPatientBucketChangeExtension'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMInformationBucketExtension'
                  minContains: 1
              items:
                $ref: '#/components/schemas/PCMHealthcareServiceExtension'
          allOf:
            - if:
                properties:
                  active:
                    const: true
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMActiveServiceBusinessStatusExtension'
            - if:
                properties:
                  active:
                    const: false
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMInactiveServiceBusinessStatusExtension'

    PCMHealthcareServiceCatalogRepresentation:
      allOf:
        - $ref: '#/components/schemas/PCMHealthcareServiceBaseResponse'
        - type: object
          properties:
            providedBy: false
            identifier:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMHealthcareServiceCatalogIdentifier'
            extension:
              type: array
              allOf:
                - not:
                    contains:
                      type: object
                      required: [url]
                      properties:
                        url:
                          const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-based-on-canonical-healthcareservice
                - not:
                    contains:
                      type: object
                      required: [url, valueCoding]
                      properties:
                        url:
                          const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-service-business-status
                        valueCoding:
                          type: object
                          required: [code]
                          properties:
                            code:
                              const: suspended
              items:
                $ref: '#/components/schemas/PCMHealthcareServiceExtension'

    PCMHealthcareServiceCatalog:
      allOf:
        - $ref: '#/components/schemas/PCMHealthcareServiceCatalogRepresentation'
        - type: object
          properties:
            meta:
              $ref: '#/components/schemas/PCMHealthcareServiceCatalogMeta'

    PCMHealthcareServiceCatalogProposalMeta:
      description: |
        Metadata for the complete catalog resource carried by
        $request-catalog-update. Unlike a direct HealthcareService POST or PUT,
        this proposal keeps the fixed catalog classification tag so PCM can compare
        the complete proposed representation with the authoritative catalog entry.
        Optional versionId and lastUpdated metadata copied from the retrieved
        canonical are removed before semantic comparison and do not provide
        optimistic concurrency.
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [tag]
          properties:
            profile:
              type: array
              contains:
                const: http://pcm.fhir.health.gov.il/StructureDefinition/pcm-healthcareservice-catalog-update-proposal
              minContains: 1
              maxContains: 1
              items:
                type: string
                format: uri
            tag:
              type: array
              contains:
                type: object
                required: [system, code]
                properties:
                  system:
                    type: string
                    const: http://pcm.fhir.health.gov.il/cs/pcm-meta-tag
                  code:
                    type: string
                    const: catalog
              minContains: 1
              maxContains: 1
              items:
                $ref: '#/components/schemas/Coding'

    PCMHealthcareServiceCatalogUpdateProposal:
      description: |
        Complete canonical representation carried by $request-catalog-update for
        semantic comparison. This is not a direct HealthcareService write profile,
        so it retains every authoritative catalog field, including the fixed
        catalog classification tag. It prohibits modifierExtension in the request
        representation and applies the documented ignore-before-comparison rule to
        optional meta.versionId, meta.lastUpdated, and unknown ordinary non-modifier
        extensions.
      allOf:
        - $ref: '#/components/schemas/PCMHealthcareServiceCatalogRepresentation'
        - type: object
          properties:
            meta:
              $ref: '#/components/schemas/PCMHealthcareServiceCatalogProposalMeta'
            modifierExtension:
              not: {}

    PCMHealthcareServiceInstance:
      allOf:
        - $ref: '#/components/schemas/PCMHealthcareServiceBaseResponse'
        - type: object
          required: [providedBy]
          properties:
            providedBy:
              $ref: '#/components/schemas/PCMLiteralReference'
            meta:
              $ref: '#/components/schemas/PCMHealthcareServiceInstanceMeta'
            identifier:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMHealthcareServiceInstanceIdentifier'
            extension:
              type: array
              minItems: 7
              allOf:
                - contains:
                    $ref: '#/components/schemas/PCMBasedOnHealthcareServiceExtension'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMApprovalWindowExtension'
                  minContains: 0
                  maxContains: 1
              items:
                $ref: '#/components/schemas/PCMHealthcareServiceExtension'

    PCMHealthcareService:
      oneOf:
        - $ref: '#/components/schemas/PCMHealthcareServiceCatalog'
        - $ref: '#/components/schemas/PCMHealthcareServiceInstance'

    PCMHealthcareServiceExistingRegistrationRequest:
      description: |
        Closed existing-catalog registration submission. Only an optional
        request-profile declaration, one basedOn reference, and unknown ordinary
        non-modifier extensions are accepted. meta.tag and every definition,
        identity, ownership, lifecycle, and approval field are prohibited. PCM adds
        the instance classification tag to the returned provider registration.
      type: object
      additionalProperties: false
      required: [resourceType, extension]
      properties:
        resourceType:
          type: string
          const: HealthcareService
        id:
          type: string
          description: Optional FHIR create metadata; ignored by PCM.
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        extension:
          type: array
          minItems: 1
          contains:
            $ref: '#/components/schemas/PCMBasedOnHealthcareServiceExtension'
          minContains: 1
          maxContains: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/PCMBasedOnHealthcareServiceExtension'
              - allOf:
                  - $ref: '#/components/schemas/Extension'
                  - not:
                      required: [url]
                      properties:
                        url:
                          enum:
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-service-business-status
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-based-on-canonical-healthcareservice
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-approval-window
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-mode
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-duration
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-allow-patient-bucket-change
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-information-bucket
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-example-query

    PCMHealthcareServiceNewServiceRequest:
      description: |
        Closed new-service registration submission. The provider supplies the
        writable service definition and must omit meta.tag. Identity, ownership,
        active, basedOn, businessStatus, and approvalWindow are prohibited; PCM
        derives those fields and adds classification tags to the returned resources.
      type: object
      additionalProperties: false
      required: [resourceType, name, category, type, extraDetails, extension]
      properties:
        resourceType:
          type: string
          const: HealthcareService
        id:
          type: string
          description: Optional FHIR create metadata; ignored by PCM.
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        name:
          type: string
          minLength: 1
        category:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CodeableConcept'
        type:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMHealthcareServiceInformationAccessType'
        extraDetails:
          type: string
          minLength: 1
        extension:
          type: array
          minItems: 5
          allOf:
            - contains:
                $ref: '#/components/schemas/PCMAccessModeExtension'
              minContains: 1
              maxContains: 1
            - contains:
                $ref: '#/components/schemas/PCMAccessDurationExtension'
              minContains: 1
              maxContains: 1
            - contains:
                $ref: '#/components/schemas/PCMInformationBucketExtension'
              minContains: 1
            - contains:
                $ref: '#/components/schemas/PCMExampleQueryExtension'
              minContains: 1
            - contains:
                $ref: '#/components/schemas/PCMAllowPatientBucketChangeExtension'
              minContains: 1
              maxContains: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/PCMAccessModeExtension'
              - $ref: '#/components/schemas/PCMAccessDurationExtension'
              - $ref: '#/components/schemas/PCMInformationBucketExtension'
              - $ref: '#/components/schemas/PCMExampleQueryExtension'
              - $ref: '#/components/schemas/PCMAllowPatientBucketChangeExtension'
              - allOf:
                  - $ref: '#/components/schemas/Extension'
                  - not:
                      required: [url]
                      properties:
                        url:
                          enum:
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-service-business-status
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-based-on-canonical-healthcareservice
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-approval-window
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-mode
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-duration
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-allow-patient-bucket-change
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-information-bucket
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-example-query

    PCMHealthcareServiceCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/PCMHealthcareServiceExistingRegistrationRequest'
        - $ref: '#/components/schemas/PCMHealthcareServiceNewServiceRequest'

    PCMHealthcareServiceBusinessStatusUpdateRequest:
      description: |
        Closed owning-provider instance lifecycle request. The client supplies
        exactly one target businessStatus of active, suspended, or cancelled.
        active and every definition, identity, ownership, linkage, and
        PCM/MoH-managed field are prohibited. PCM validates the transition and
        derives active.
      type: object
      additionalProperties: false
      required: [resourceType, id, extension]
      properties:
        resourceType:
          type: string
          const: HealthcareService
        id:
          type: string
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        extension:
          type: array
          minItems: 1
          contains:
            $ref: '#/components/schemas/PCMOwnerServiceBusinessStatusExtension'
          minContains: 1
          maxContains: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/PCMOwnerServiceBusinessStatusExtension'
              - allOf:
                  - $ref: '#/components/schemas/Extension'
                  - not:
                      required: [url]
                      properties:
                        url:
                          enum:
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-service-business-status
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-based-on-canonical-healthcareservice
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-approval-window
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-mode
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-access-duration
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-allow-patient-bucket-change
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-information-bucket
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-example-query

    PCMConsentBusinessStatusExtension:
      type: object
      required: [url, valueCoding]
      properties:
        url:
          type: string
          const: http://pcm.fhir.health.gov.il/StructureDefinition/ext-consent-business-status
        valueCoding:
          type: object
          required: [system, code]
          properties:
            system:
              type: string
              const: http://pcm.fhir.health.gov.il/cs/pcm-consent-business-status
            code:
              type: string
              enum: [requested, active, rejected, temporarily-inactive, permanently-inactive, service-provider-cancelled]
            display:
              type: string

    PCMConsentIdentifier:
      allOf:
        - $ref: '#/components/schemas/Identifier'
        - type: object
          required: [use, system, value]
          properties:
            use:
              type: string
              const: official
            system:
              type: string
              const: http://pcm.fhir.health.gov.il/identifier/pcm-consent-id
            value:
              type: string
              minLength: 1

    PCMConsentAccessModeCategory:
      description: |
        Server-managed access mode. PCM initializes the proposed Consent from the
        selected service. An authorized patient decision, including an assisted or
        delegated flow, may retain that mode or narrow continuous access to one-time.
        The authoritative Consent carries the requested mode while proposed and the
        effective approved mode after a decision; it never widens a one-time service
        to continuous.
      allOf:
        - $ref: '#/components/schemas/CodeableConcept'
        - type: object
          required: [coding]
          properties:
            coding:
              type: array
              minItems: 1
              maxItems: 1
              items:
                allOf:
                  - $ref: '#/components/schemas/Coding'
                  - type: object
                    required: [system, code]
                    properties:
                      system:
                        type: string
                        const: http://pcm.fhir.health.gov.il/cs/pcm-consent-access-mode
                      code:
                        type: string
                        enum: [one-time, continuous]

    PCMTreatmentPurpose:
      allOf:
        - $ref: '#/components/schemas/Coding'
        - type: object
          required: [system, code]
          properties:
            system:
              type: string
              const: http://terminology.hl7.org/CodeSystem/v3-ActReason
            code:
              type: string
              const: TREAT

    PCMConsentRequestorRole:
      allOf:
        - $ref: '#/components/schemas/CodeableConcept'
        - type: object
          required: [coding]
          properties:
            coding:
              type: array
              minItems: 1
              maxItems: 1
              items:
                allOf:
                  - $ref: '#/components/schemas/Coding'
                  - type: object
                    required: [system, code]
                    properties:
                      system:
                        type: string
                        const: http://terminology.hl7.org/CodeSystem/v3-ParticipationType
                      code:
                        type: string
                        const: IRCP

    PCMConsentRequestorActor:
      allOf:
        - $ref: '#/components/schemas/ConsentProvisionActor'
        - type: object
          required: [role, reference]
          properties:
            role:
              $ref: '#/components/schemas/PCMConsentRequestorRole'
            reference:
              $ref: '#/components/schemas/PCMLiteralReference'

    PCMConsentDataSourceRole:
      allOf:
        - $ref: '#/components/schemas/CodeableConcept'
        - type: object
          required: [coding]
          properties:
            coding:
              type: array
              minItems: 1
              maxItems: 1
              items:
                allOf:
                  - $ref: '#/components/schemas/Coding'
                  - type: object
                    required: [system, code]
                    properties:
                      system:
                        type: string
                        const: http://terminology.hl7.org/CodeSystem/v3-ParticipationType
                      code:
                        type: string
                        const: CST

    PCMConsentDataSourceActor:
      allOf:
        - $ref: '#/components/schemas/ConsentProvisionActor'
        - type: object
          required: [role, reference]
          properties:
            role:
              $ref: '#/components/schemas/PCMConsentDataSourceRole'
            reference:
              $ref: '#/components/schemas/PCMLiteralReference'

    PCMConsentActor:
      allOf:
        - $ref: '#/components/schemas/ConsentProvisionActor'
        - if:
            type: object
            additionalProperties: true
            required: [role]
            properties:
              role:
                type: object
                additionalProperties: true
                required: [coding]
                properties:
                  coding:
                    type: array
                    contains:
                      type: object
                      additionalProperties: true
                      required: [code]
                      properties:
                        code:
                          const: CST
          then:
            $ref: '#/components/schemas/PCMConsentDataSourceActor'

    PCMConsentProvision:
      description: |
        Server-managed authorization provision. On approval, the period starts at
        the approval timestamp and ends after the effective patient-approved duration,
        which may be shorter than but cannot exceed the selected service maximum. A
        later authorized patient decision may move the end earlier but cannot extend
        it; the original approval-anchored start remains unchanged.
      allOf:
        - $ref: '#/components/schemas/ConsentProvision'
        - type: object
          required: [type, purpose, actor]
          properties:
            type:
              type: string
              const: permit
            purpose:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PCMTreatmentPurpose'
            actor:
              type: array
              minItems: 1
              contains:
                $ref: '#/components/schemas/PCMConsentRequestorActor'
              minContains: 1
              maxContains: 1
              items:
                $ref: '#/components/schemas/PCMConsentActor'
            action: false
            securityLabel: false
            class: false
            code: false
            dataPeriod: false
            data: false

    PCMConsentCreateRequest:
      description: |
        Closed Consent submit projection. The provider supplies the fixed request
        envelope, logical patient identifier, and exactly one service-instance
        reference and fixed legal policy. Consent identifiers, business status,
        provision, and all other business fields are prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, status, scope, category, patient, policy, extension]
      properties:
        resourceType:
          type: string
          const: Consent
        id:
          type: string
          description: Optional FHIR create metadata; ignored by PCM.
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        status:
          type: string
          const: proposed
        scope:
          $ref: '#/components/schemas/PCMConsentScope'
        category:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMConsentInformationAccessCategory'
        patient:
          $ref: '#/components/schemas/PCMLogicalPatientReference'
        policy:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMConsentPolicy'
        extension:
          type: array
          minItems: 1
          contains:
            $ref: '#/components/schemas/PCMConsentServiceExtension'
          minContains: 1
          maxContains: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/PCMConsentServiceExtension'
              - allOf:
                  - $ref: '#/components/schemas/Extension'
                  - not:
                      required: [url]
                      properties:
                        url:
                          enum:
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-consent-business-status
                            - http://pcm.fhir.health.gov.il/StructureDefinition/ext-pcm-service

    PCMConsentDeactivateRequest:
      description: |
        Closed owner deactivation projection. The provider supplies
        status=inactive and the fixed base-required scope, category, and legal policy.
        Patient, identifiers, service linkage, business status, provision, and all
        other Consent content are prohibited.
      type: object
      additionalProperties: false
      required: [resourceType, id, status, scope, category, policy]
      properties:
        resourceType:
          type: string
          const: Consent
        id:
          type: string
        meta:
          $ref: '#/components/schemas/PCMInteractionMeta'
        status:
          type: string
          const: inactive
        scope:
          $ref: '#/components/schemas/PCMConsentScope'
        category:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMConsentInformationAccessCategory'
        policy:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PCMConsentPolicy'
        extension:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Extension'
              - not:
                  required: [url]
                  properties:
                    url:
                      enum:
                        - http://pcm.fhir.health.gov.il/StructureDefinition/ext-consent-business-status
                        - http://pcm.fhir.health.gov.il/StructureDefinition/ext-pcm-service

    PCMConsent:
      description: |
        Authoritative hosted/returned PCM Consent. Synthetic test identifiers use
        exactly `http://fhir.health.gov.il/identifier/il-hdp-test-id|1` or `|2`;
        those Consents carry the HTEST security label, and non-test identifiers do
        not. The selected service supplies the initial requested/default access mode
        and maximum duration. Authorized patient decisions, including assisted or
        delegated flows, may narrow continuous access to one-time and/or shorten the
        effective period. The authoritative resource carries the requested mode while
        proposed and the effective approved mode and period after approval; it never
        widens or extends the service limits.
      x-pcm-test-patient-security:
        identifierSystem: http://fhir.health.gov.il/identifier/il-hdp-test-id
        allowedValues: ["1", "2"]
        requiredSecurityLabel:
          system: http://terminology.hl7.org/CodeSystem/v3-ActReason
          code: HTEST
        bidirectional: true
      allOf:
        - $ref: '#/components/schemas/Consent'
        - type: object
          required: [resourceType, id, meta, identifier, status, dateTime, scope, category, patient, policy, extension, provision]
          properties:
            resourceType:
              type: string
              const: Consent
            id:
              type: string
              readOnly: true
            meta:
              allOf:
                - $ref: '#/components/schemas/PCMResponseMeta'
                - type: object
                  properties:
                    profile:
                      contains:
                        const: http://pcm.fhir.health.gov.il/StructureDefinition/pcm-consent
                      minContains: 1
                      maxContains: 1
            identifier:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMConsentIdentifier'
            status:
              type: string
              enum: [proposed, active, rejected, inactive, entered-in-error]
            dateTime:
              type: string
              format: date-time
            scope:
              $ref: '#/components/schemas/PCMConsentScope'
            category:
              type: array
              minItems: 2
              maxItems: 2
              allOf:
                - contains:
                    $ref: '#/components/schemas/PCMConsentInformationAccessCategory'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMConsentAccessModeCategory'
                  minContains: 1
                  maxContains: 1
              items:
                oneOf:
                  - $ref: '#/components/schemas/PCMConsentInformationAccessCategory'
                  - $ref: '#/components/schemas/PCMConsentAccessModeCategory'
            patient:
              $ref: '#/components/schemas/PCMLogicalPatientReference'
            policy:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PCMConsentPolicy'
            extension:
              type: array
              allOf:
                - contains:
                    $ref: '#/components/schemas/PCMConsentServiceExtension'
                  minContains: 1
                  maxContains: 1
                - contains:
                    $ref: '#/components/schemas/PCMConsentBusinessStatusExtension'
                  minContains: 1
                  maxContains: 1
              items:
                $ref: '#/components/schemas/Extension'
            provision:
              $ref: '#/components/schemas/PCMConsentProvision'
            performer: false
            organization: false
            sourceAttachment: false
            sourceReference: false
            policyRule: false
            verification: false
          allOf:
            - if:
                properties:
                  status:
                    const: proposed
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMConsentRequestedStatusExtension'
                  provision:
                    not:
                      required: [period]
                      properties:
                        period: {}
            - if:
                properties:
                  status:
                    const: active
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMConsentActiveStatusExtension'
                  provision:
                    type: object
                    additionalProperties: true
                    required: [period]
                    properties:
                      period:
                        type: object
                        required: [start, end]
                        properties:
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
            - if:
                properties:
                  status:
                    const: rejected
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMConsentRejectedStatusExtension'
                  provision:
                    not:
                      required: [period]
                      properties:
                        period: {}
            - if:
                type: object
                additionalProperties: true
                required: [status]
                properties:
                  status:
                    enum: [proposed, rejected]
              then:
                type: object
                additionalProperties: true
                properties:
                  provision:
                    type: object
                    additionalProperties: true
                    properties:
                      actor:
                        type: array
                        not:
                          contains:
                            type: object
                            additionalProperties: true
                            required: [role]
                            properties:
                              role:
                                type: object
                                additionalProperties: true
                                required: [coding]
                                properties:
                                  coding:
                                    type: array
                                    contains:
                                      type: object
                                      additionalProperties: true
                                      required: [system, code]
                                      properties:
                                        system:
                                          const: http://terminology.hl7.org/CodeSystem/v3-ParticipationType
                                        code:
                                          const: CST
            - if:
                properties:
                  status:
                    const: inactive
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMConsentInactiveStatusExtension'
            - if:
                properties:
                  status:
                    const: entered-in-error
              then:
                additionalProperties: true
                properties:
                  extension:
                    contains:
                      $ref: '#/components/schemas/PCMConsentPermanentInactiveStatusExtension'
            - if:
                type: object
                additionalProperties: true
                properties:
                  patient:
                    type: object
                    additionalProperties: true
                    required: [identifier]
                    properties:
                      identifier:
                        type: object
                        additionalProperties: true
                        required: [system]
                        properties:
                          system:
                            const: http://fhir.health.gov.il/identifier/il-hdp-test-id
              then:
                type: object
                additionalProperties: true
                properties:
                  meta:
                    type: object
                    additionalProperties: true
                    required: [security]
                    properties:
                      security:
                        type: array
                        contains:
                          type: object
                          additionalProperties: true
                          required: [system, code]
                          properties:
                            system:
                              const: http://terminology.hl7.org/CodeSystem/v3-ActReason
                            code:
                              const: HTEST
              else:
                type: object
                additionalProperties: true
                properties:
                  meta:
                    type: object
                    additionalProperties: true
                    properties:
                      security:
                        type: array
                        not:
                          contains:
                            type: object
                            additionalProperties: true
                            required: [system, code]
                            properties:
                              system:
                                const: http://terminology.hl7.org/CodeSystem/v3-ActReason
                              code:
                                const: HTEST

