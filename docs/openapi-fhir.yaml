    OperationOutcomeOrganizationCreateWrongRole:
      summary: Organization create rejected for wrong caller role
      value:
        resourceType: OperationOutcome
        id: outcome-organization-create-wrong-role
        issue:
          - details:
              text: "Caller role is not authorized to create a Service Provider child."
            expression:
              - Organization
            severity: error
            code: forbidden
            diagnostics: "POST Organization is authorized only for the documented Service Provider-child create flow."

    OperationOutcomeOrganizationCreateCrossParent:
      summary: Organization create rejected for cross-Parent claim
      value:
        resourceType: OperationOutcome
        id: outcome-organization-create-cross-parent
        issue:
          - details:
              text: "Cross-Parent Service Provider-child creation is forbidden."
            expression:
              - Organization.partOf
            severity: error
            code: forbidden
            diagnostics: "PCM derives the Parent from the authenticated client; Organization.partOf cannot select or claim another Parent."

    OperationOutcomeOrganizationCreateUnsupportedChild:
      summary: Organization create rejected for unsupported child type
      value:
        resourceType: OperationOutcome
        id: outcome-organization-create-unsupported-child
        issue:
          - details:
              text: "This Organization child type is not supported by POST Organization."
            expression:
              - Organization.type
            severity: error
            code: not-supported
            diagnostics: "The interaction accepts only PCMOrganizationServiceProviderCreate; Parent and Data Source children remain onboarding-managed."

    OperationOutcomeMaterialCanonicalChange:
      summary: Catalog update requires new service registration
      value:
        resourceType: OperationOutcome
        id: outcome-healthcareservice-material-catalog-update
        issue:
          - severity: error
            code: business-rule
            details:
              text: "Catalog update requires a new-service registration request."
            diagnostics: "Only name, extraDetails, and exampleQuery may differ in $request-catalog-update. Submit material changes through the new-service registration flow."
            expression:
              - Parameters.parameter.resource

    OperationOutcomeCanonicalUpdateViaPut:
      summary: Canonical catalog update not allowed through PUT
      value:
        resourceType: OperationOutcome
        id: outcome-healthcareservice-unsupported-change
        issue:
          - severity: error
            code: not-supported
            details:
              text: "Canonical catalog changes are not accepted through HealthcareService update."
            diagnostics: "Use $request-catalog-update for a non-material catalog change or submit a new-service registration request for a material change."
            expression:
              - HealthcareService

    OperationOutcomeDuplicateServiceRegistration:
      summary: Provider already has this canonical service registration
      value:
        resourceType: OperationOutcome
        id: outcome-duplicate-service-registration
        issue:
          - severity: error
            code: conflict
            details:
              text: "Service registration already exists."
            diagnostics: "This Service Provider already has a registration for the selected canonical HealthcareService."

    OperationOutcomeDuplicateServiceName:
