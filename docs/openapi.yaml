openapi: 3.1.0
info:
  title: PCM API (FHIR + OAuth2)
  version: "0.4.1"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Combined OpenAPI entry point that references the FHIR and OAuth2 specifications.
    Data Source authorization uses RFC 9396 authorization_details with authentication-only
    private_key_jwt. PCM system workflows use self-contained read-only Contract grants; Contract.subType selects their scope and disclosure rules. Contract OAuth context omits HealthcareService; Consent context retains it. Contracts use executed/terminated/revoked lifecycle states, explicit PCM-managed source lists and optional expiry.
    The production PCM FHIR and OAuth2 base is
    `https://pcm2m.health.gov.il/api/fhir-service/r4`; the test base is
    `https://pcm2mtest.health.gov.il/api/fhir-service/r4`. Both protocols share
    the selected environment base, except RFC 8414 discovery, whose Path Item
    explicitly uses the environment origin. Access-token
    maximum lifetime is 30 seconds in production and 86400 seconds in test; clients use
    returned expires_in and exp values. Participant hosts under
    `example.org` are placeholders. Canonical, identifier-system, and other named
    protocol URIs remain the published identifiers. PCM API connections require mTLS, including discovery, metadata, token,
    introspection, and FHIR interactions. Browser requests to /authorize and
    associated interactive login/approval pages use HTTPS without requiring a
    client certificate. Backend client assertions support ES256 and ES384 and
    accept optional kid, currently the unpadded base64url-encoded SHA-256 JWK
    thumbprint under RFC 7638. A supplied kid must select an approved signing key
    for the client; an invalid value fails without fallback. If absent,
    PCM resolves the key by client ID for either algorithm.
    SMART clients must include kid.
    Public FHIR POST/PUT interactions use closed request projections and reject
    prohibited content atomically with OperationOutcome responses. MoH/PCM owns
    Organization.active; Data Sources expose runtime availability through the
    status of their currently referenced Endpoint; Service Providers control only
    the documented HealthcareService instance business-status transitions.
    For FHIR searches, authorization is a hard ceiling: every primary match must both
    satisfy the supplied search criteria and be authorized for the caller to read.
    Search filters can only narrow the authorized primary-result set. `_include` and
    `_include:iterate` can add only related resources that the caller is authorized
    to read under the same resource-visibility rules; they never widen access.
servers:
  - url: https://pcm2mtest.health.gov.il/api/fhir-service/r4
    description: Test PCM FHIR and OAuth2 base. API calls require mTLS; browser authorization uses HTTPS without a client certificate.
  - url: https://pcm2m.health.gov.il/api/fhir-service/r4
    description: Production PCM FHIR and OAuth2 base. API calls require mTLS; browser authorization uses HTTPS without a client certificate.

tags:
  - name: Organization
    description: Parent, service-provider, and data-source organizations.
  - name: Endpoint
    description: FHIR server endpoints for data sources.
  - name: HealthcareService
    description: Consent catalog services and provider registrations.
  - name: Consent
    description: Consent request creation, owned consent read/search, and owned consent deactivation. Deletion is not supported.
  - name: Contract
    description: Read-only PCM system authorization grants.
  - name: CapabilityStatement
    description: Server metadata and supported interactions.
  - name: SMART
    description: SMART on FHIR OAuth2 configuration.
  - name: OAuth2
    description: Token issuance and introspection.

security:
  - mtlsTransport: []
    bearerAuth: []

paths:
  /.well-known/smart-configuration:
    $ref: "./openapi-fhir.yaml#/paths/~1.well-known~1smart-configuration"
  /.well-known/oauth-authorization-server/api/fhir-service/r4:
    $ref: "./openapi-oauth.yaml#/paths/~1.well-known~1oauth-authorization-server~1api~1fhir-service~1r4"
  /.well-known/oauth-authorization-server:
    $ref: "./openapi-oauth.yaml#/paths/~1.well-known~1oauth-authorization-server"
  /authorize:
    $ref: "./openapi-oauth.yaml#/paths/~1authorize"
  /metadata:
    $ref: "./openapi-fhir.yaml#/paths/~1metadata"
  /Organization:
    $ref: "./openapi-fhir.yaml#/paths/~1Organization"
  /Organization/_search:
    $ref: "./openapi-fhir.yaml#/paths/~1Organization~1_search"
  /Organization/{id}:
    $ref: "./openapi-fhir.yaml#/paths/~1Organization~1{id}"
  /Endpoint:
    $ref: "./openapi-fhir.yaml#/paths/~1Endpoint"
  /Endpoint/_search:
    $ref: "./openapi-fhir.yaml#/paths/~1Endpoint~1_search"
  /Endpoint/{id}:
    $ref: "./openapi-fhir.yaml#/paths/~1Endpoint~1{id}"
  /HealthcareService:
    $ref: "./openapi-fhir.yaml#/paths/~1HealthcareService"
  /HealthcareService/_search:
    $ref: "./openapi-fhir.yaml#/paths/~1HealthcareService~1_search"
  /HealthcareService/{id}:
    $ref: "./openapi-fhir.yaml#/paths/~1HealthcareService~1{id}"
  /HealthcareService/{id}/$request-catalog-update:
    $ref: "./openapi-fhir.yaml#/paths/~1HealthcareService~1{id}~1$request-catalog-update"
  /Consent:
    $ref: "./openapi-fhir.yaml#/paths/~1Consent"
  /Consent/_search:
    $ref: "./openapi-fhir.yaml#/paths/~1Consent~1_search"
  /Consent/{id}:
    $ref: "./openapi-fhir.yaml#/paths/~1Consent~1{id}"
  /token:
    $ref: "./openapi-oauth.yaml#/paths/~1token"
  /introspect:
    $ref: "./openapi-oauth.yaml#/paths/~1introspect"

  /Contract:
    $ref: "./openapi-fhir.yaml#/paths/~1Contract"
  /Contract/_search:
    $ref: "./openapi-fhir.yaml#/paths/~1Contract~1_search"
  /Contract/{id}:
    $ref: "./openapi-fhir.yaml#/paths/~1Contract~1{id}"

components:
  securitySchemes:
    mtlsTransport:
      $ref: "./openapi-fhir.yaml#/components/securitySchemes/mtlsTransport"
    bearerAuth:
      $ref: "./openapi-fhir.yaml#/components/securitySchemes/bearerAuth"
